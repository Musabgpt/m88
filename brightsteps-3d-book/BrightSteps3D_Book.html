<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrightSteps 3D Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A Year 2 · Autumn 2 learning book in 3D (English, with short Arabic notes for parents). Turn the pages, lift the flaps, play with pop-up models, practise, quiz and home learning: صوتيات، كلمات صعبة، قراءة، كتابة، رياضيات، أشكال، علوم، تاريخ، تصميم، حاسوب، موسيقى، رياضة، وقيم.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
:root{
  /* Layout: a floating toy-town under a Bonfire-Night sky. One 3D stage travels from world to world; a reading sheet docks beside it (below it on phones). */
  --sky0:#070b1f; --sky1:#0d1434; --panel:#121a3e; --panel2:#1a2352; --panel3:#222d63; --line:#2a3672;
  --ink:#f3f5ff; --ink2:#c9d0f3; --muted:#949fd0;
  --ember:#ff7b39; --ember2:#ffb04d; --gold:#ffd166; --mint:#3ddbb0; --berry:#ff5d8f; --sky:#6db4ff; --violet:#b29bff;
  --shadow:0 18px 40px rgba(2,4,18,.55);
  --f-display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-read:"Andika","Readex Pro","Trebuchet MS",system-ui,sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutR:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{background:var(--sky0);color:var(--ink)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.75;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sky0)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-read)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;
  padding-block:9px;padding-left:var(--gut);padding-right:var(--gutR);
  background:rgba(7,11,31,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(64,80,160,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;background:none;border:0;padding:0;text-align:start;overflow:hidden}
.brand>span:last-child{min-width:0;overflow:hidden}
.mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  background:conic-gradient(from 200deg,var(--ember),var(--gold),var(--berry),var(--violet),var(--ember));box-shadow:0 0 0 2px #0b1230 inset,0 6px 18px rgba(255,123,57,.35)}
.mark i{width:22px;height:22px;background:var(--sky0);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.2px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b em{font-style:normal;color:var(--ember2)}
.brand small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;background:#1d1a3a;border:1px solid #4a3a5e;color:var(--gold);font-weight:700;font-family:var(--f-display);font-size:16px;white-space:nowrap}
.pill .star{width:16px;height:16px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:0 0 auto;transition:transform .15s}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--ember);border-color:var(--ember);color:#1b0c02}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-family:var(--f-display);font-size:16px;line-height:1.2;
  background:var(--panel3);color:var(--ink);box-shadow:0 4px 0 #0c1233;transition:transform .12s,box-shadow .12s,filter .15s;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1233}
.btn.hot{background:linear-gradient(180deg,#ff9150,var(--ember));color:#2a1003;box-shadow:0 4px 0 #a43f10}
.btn.hot:active{box-shadow:0 1px 0 #a43f10}
.btn.mint{background:linear-gradient(180deg,#5ef0c8,var(--mint));color:#062a20;box-shadow:0 4px 0 #13836a}
.btn.gold{background:linear-gradient(180deg,#ffe08f,var(--gold));color:#3a2600;box-shadow:0 4px 0 #a9822a}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:0;background:#22306b;color:var(--sky);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;vertical-align:middle;flex:0 0 auto}
.say svg{width:18px;height:18px;fill:currentColor}

/* ---------- home ---------- */
.hub{position:relative}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#1a2563 0,#0c1234 55%,#070b1f 100%);touch-action:pan-y}
.stage>canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline:none}
.hub .stage{height:clamp(380px,64vh,660px)}
.ovl{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;pointer-events:none}
.ov-top{padding:12px var(--gutR) 0 var(--gut);display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.ov-top>*{pointer-events:auto}
.ov-cap{padding:0 var(--gutR) 8px var(--gut);display:flex;justify-content:center;pointer-events:none}
.cap{max-width:520px;background:rgba(7,11,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(110,130,230,.28);border-radius:14px;padding:7px 14px;text-align:center;font-size:14px;line-height:1.55;color:var(--ink2)}
.cap b{color:var(--ink);font-weight:600}
.cap .en{display:block;color:var(--gold);font-size:16px}
.cap:empty{display:none}
.ov-bar{padding:6px var(--gutR) 12px var(--gut);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;
  background:linear-gradient(0deg,rgba(7,11,31,.85),rgba(7,11,31,0))}
.ov-bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(140,160,255,.35);background:rgba(18,26,62,.85);color:var(--ink);border-radius:99px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.2;min-height:40px;white-space:nowrap;transition:background .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ember);border-color:var(--ember);color:#2a1003}
.chip.go{background:var(--mint);border-color:var(--mint);color:#062a20}
.chip.gold{background:var(--gold);border-color:var(--gold);color:#3a2600}
.chip .en{font-family:inherit}
.ov-free{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px var(--gutR) 8px var(--gut);overflow:hidden;pointer-events:none}
.wtitle{background:rgba(7,11,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(110,130,230,.28);border-radius:14px;padding:6px 12px;line-height:1.25;min-width:0}
.wtitle b{font-family:var(--f-display);font-size:17px;display:block}
.wtitle span{font-size:12px;color:var(--gold);font-family:var(--f-read)}
.ov-top .sp{flex:1}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2);z-index:2}

.hub-hello{position:absolute;z-index:3;top:16px;right:var(--gutR);left:var(--gut);pointer-events:none}
.hub-hello h1{font-size:clamp(26px,4.6vw,46px);letter-spacing:-.3px;text-shadow:0 4px 24px rgba(0,0,0,.6);max-width:14ch}
.hub-hello h1 em{font-style:normal;color:var(--ember2)}
.hub-hello p{color:var(--ink2);max-width:38ch;font-size:14px;text-shadow:0 2px 12px rgba(0,0,0,.8)}

.wrap{padding-left:var(--gut);padding-right:var(--gutR);padding-block:22px 40px;max-width:1240px;margin:0 auto}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h small{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.wk small{color:var(--muted);display:block;font-size:12px}
.wk b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.2;margin:2px 0}
.wk span{font-size:13px;color:var(--ink2);display:block}
.wk.hot{border-color:#7a3a1c;background:linear-gradient(160deg,#2a1730,var(--panel))}
.wk.hot b{color:var(--ember2)}
.district{margin-top:18px}
.district h3{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.district h3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.wc{position:relative;text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s;overflow:hidden}
.wc:hover{transform:translateY(-2px);border-color:#5262b8}
.wc .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.wc b{font-family:var(--f-display);font-size:16px;line-height:1.3}
.wc .en{font-size:13px;color:var(--gold)}
.wc small{color:var(--muted);font-size:12px;line-height:1.5}
.wc .meter{margin-top:auto;height:6px;border-radius:9px;background:#0b1130;overflow:hidden}
.wc .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:9px}
.wc .done{position:absolute;top:10px;left:10px;font-size:12px;color:var(--mint);font-weight:700}

/* ---------- world ---------- */
.world{display:grid;grid-template-columns:minmax(0,1fr) 450px;min-height:calc(100vh - 59px)}
.world .stage{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));height:calc(100vh - 59px - env(safe-area-inset-top,0px));grid-column:1;grid-row:1}
.sheet{grid-column:2;grid-row:1;background:var(--sky1);border-inline-start:1px solid var(--line);min-width:0}
.tabs{display:flex;gap:6px;padding:12px var(--gutR) 10px var(--gut);position:sticky;top:calc(59px + env(safe-area-inset-top,0px));z-index:5;background:var(--sky1);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;min-height:42px}
.tab.on{background:var(--panel3);color:var(--ink)}
.tabbody{padding:16px var(--gutR) 60px var(--gut);display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card h4{font-size:16px;margin:10px 0 6px;color:var(--ink)}
.card p,.card li{color:var(--ink2);font-size:14.5px}
.card ul,.card ol{margin:6px 0 0;padding-inline-start:20px}
.card li{margin:3px 0}
.card.glow{border-color:#6c4a2a;background:linear-gradient(170deg,#2b1c2f,var(--panel) 60%)}
.kicker{font-size:12px;letter-spacing:.6px;color:var(--ember2);font-weight:600;display:block;margin-bottom:4px}
.big-en{font-family:var(--f-read);direction:ltr;font-size:20px;color:var(--ink);line-height:1.5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big-en .say{margin-inline-start:auto}
.enline{display:flex;align-items:center;gap:10px;background:#0f1638;border:1px solid #26326a;border-radius:12px;padding:8px 10px;margin:8px 0;direction:ltr}
.enline span{font-family:var(--f-read);font-size:17px;color:var(--ink);flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.warn{background:#2c1a14;border:1px solid #7a3a1c;border-radius:14px;padding:10px 12px;color:#ffd9c2;font-size:14px}
.ok{color:var(--mint)} .bad{color:var(--berry)} .gold-t{color:var(--gold)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#18214d;color:var(--ink);font-weight:600;font-size:13px}
td{color:var(--ink2)}
tr:last-child td{border-bottom:0}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vw{display:inline-flex;align-items:center;gap:6px;background:#0f1638;border:1px solid #26326a;border-radius:11px;padding:4px 6px 4px 10px;font-size:13px}
.vw b{font-family:var(--f-read);direction:ltr;color:var(--ink);font-size:15px}
.vw .say{width:28px;height:28px}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.q-dots{display:flex;gap:4px}
.q-dots i{width:22px;height:6px;border-radius:9px;background:#26306a}
.q-dots i.y{background:var(--mint)} .q-dots i.n{background:var(--berry)}
.q-prompt{font-family:var(--f-display);font-size:20px;line-height:1.45;color:var(--ink)}
.q-prompt .en{font-size:22px;color:var(--gold)}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.q-opt{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;min-height:58px;font-size:17px;font-family:var(--f-display);font-weight:700;color:var(--ink);transition:transform .12s}
.q-opt.en-o{font-family:var(--f-read)}
.q-opt:active{transform:scale(.97)}
.q-opt.y{border-color:var(--mint);background:#0f3b37;color:#c6fff0}
.q-opt.n{border-color:var(--berry);background:#3a1430;color:#ffd0e0}
.q-why{font-size:14px;color:var(--ink2);background:#0f1638;border-radius:12px;padding:10px 12px;border:1px solid #26326a}
.q-end{text-align:center;padding:10px}
.q-end b{font-family:var(--f-display);font-size:42px;color:var(--gold);display:block}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.inp,select.inp,textarea.inp{background:#0e1536;border:1px solid #2f3b7d;border-radius:12px;padding:10px 12px;color:var(--ink);width:100%;min-width:0;font-size:16px}
textarea.inp{resize:vertical;min-height:110px;line-height:1.7}
.inp.en{direction:ltr;text-align:left}
.check{display:flex;gap:10px;align-items:flex-start;background:#0f1638;border:1px solid #26326a;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink2);font-size:14.5px}
.check input{width:22px;height:22px;accent-color:var(--mint);flex:0 0 auto;margin-top:2px}
.check.y{border-color:#1c6e5a;background:#0d2c2b;color:var(--ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:12px;border:1px solid #2f3b7d;background:#0e1536;color:var(--muted);font-size:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.dot.y{background:var(--mint);border-color:var(--mint);color:#062a20}
.dot.today{outline:2px solid var(--gold);outline-offset:2px}
.prog{height:12px;background:#0b1130;border-radius:9px;overflow:hidden;border:1px solid #26306a}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:9px;transition:width .4s}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#0f1638;border:1px solid #26326a;border-radius:14px;padding:10px;text-align:center}
.stat b{font-family:var(--f-display);font-size:26px;display:block;color:var(--gold);line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.ai-out{white-space:pre-wrap;background:#0f1638;border:1px dashed #3b4aa0;border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--ink);min-height:40px}
.ai-out:empty{display:none}
.tile-row{display:flex;gap:8px;flex-wrap:wrap}
.tile{border:2px solid #2f3b7d;background:#0e1536;border-radius:14px;padding:10px 14px;font-family:var(--f-read);font-size:20px;direction:ltr;color:var(--ink);min-height:50px}
.tile.on{border-color:var(--gold);background:#2b2410}
.tile.y{border-color:var(--mint);background:#0d2c2b}
.tile.n{border-color:var(--berry);background:#3a1430}

/* overlays inside stage */
.stage-panel{display:flex;justify-content:center;pointer-events:none;flex:0 0 auto}
.stage-panel.bot{margin-top:auto}
.stage-panel>*{pointer-events:auto}
.sp-card{background:rgba(9,14,40,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(120,140,240,.35);border-radius:16px;padding:10px 12px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.slider input{flex:1;accent-color:var(--ember);min-width:0}
.slider b{font-family:var(--f-display);color:var(--gold);min-width:3.2em;text-align:center}
.flash{font-family:var(--f-read);direction:ltr;font-size:clamp(44px,9vw,84px);color:#fff;text-shadow:0 0 30px rgba(255,180,90,.65);text-align:center;line-height:1.1}

/* boot */
.boot{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--ink2);padding-inline:16px}
.boot .mark{width:64px;height:64px;margin:0 auto 14px;animation:spin 3s linear infinite}
.boot .mark i{width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast + pen */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,240%);opacity:0;visibility:hidden;z-index:90;background:#141d48;border:1px solid #4553a8;color:var(--ink);padding:10px 18px;border-radius:16px;font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,1.3,.4,1);max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#pen{position:fixed;inset:0;z-index:80;touch-action:none;display:none;cursor:crosshair}
#pen.on{display:block}
.penbar{position:fixed;z-index:85;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;gap:6px;background:#121a3e;border:1px solid #3a4796;border-radius:18px;padding:8px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);overflow-x:auto}
.penbar.on{display:flex}
.penbar button{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:#1d275a;flex:0 0 auto;display:grid;place-items:center;color:var(--ink);font-size:16px}
.penbar button.sw.on{border-color:#fff}
.penbar .sw i{width:20px;height:20px;border-radius:50%;display:block}

@media (max-width:980px){

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Ease={lin:t=>t,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}};
const wrap=(t,n)=>{const out=[];let line='';String(t).split(' ').forEach(x=>{if((line+' '+x).trim().length>n&&line){out.push(line);line=x}else line=(line+' '+x).trim()});if(line)out.push(line);return out.join('\n')};
const angDiff=a=>{a=(a+Math.PI)%(Math.PI*2);if(a<0)a+=Math.PI*2;return a-Math.PI};
/* hex colours are authored in sRGB: convert them to linear so output looks as designed */
if(window.THREE&&!THREE.Color.prototype._bs){const cs=THREE.Color.prototype.set;THREE.Color.prototype.set=function(v){cs.call(this,v);if(typeof v==='string'||typeof v==='number')this.convertSRGBToLinear();return this};THREE.Color.prototype._bs=1}
const FONT_D='"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif', FONT_R='"Andika","Readex Pro","Trebuchet MS",sans-serif', FONT_B='"Readex Pro","Segoe UI",Tahoma,sans-serif';
const DAY=864e5;const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-today())/DAY);
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const arDate=d=>AR_DAYS[d.getDay()]+' '+d.getDate()+' '+AR_MON[d.getMonth()];

/* ================= storage (+ private cloud copy when the viewer allows) ================= */
const Store={
  key:'bs3d.v1', s:null,
  def(){return {v:1,updatedAt:0,stars:0,done:{},books:[],hw:{},jar:[],hand:['','','','',''],thanks:['','',''],mats:[],btsr:{},water:{},diary:'',name:'',magpie:{},muted:false,last:'',seen:{}}},
  load(){let d=null;try{d=JSON.parse(localStorage.getItem(this.key)||'null')}catch(e){}this.s=Object.assign(this.def(),d&&typeof d==='object'?d:{})},
  save(){this.s.updatedAt=Date.now();try{localStorage.setItem(this.key,JSON.stringify(this.s))}catch(e){}Cloud.queue()}
};
const Cap={downloads:null,sample:null};
const Cloud={
  ref:null,busy:false,dirty:false,timer:0,
  async init(){
    if(!window.claude||typeof window.claude.use!=='function')return;
    const use=n=>Promise.resolve().then(()=>window.claude.use(n)).catch(()=>null);
    use('downloads').then(d=>{Cap.downloads=d;App.capsChanged()});
    use('sample').then(s=>{Cap.sample=s;App.capsChanged()});
    try{
      const [user,db]=await Promise.all([use('user'),use('db')]);
      if(!user||!db)return;
      const id=await user.id();if(!id)return;
      this.ref=db.doc('data/users/'+id+'/bs3d');
      const snap=await Promise.race([this.ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
      if(snap&&snap.exists){
        const d=snap.data()||{};
        if(d.state&&(d.updatedAt||0)>(Store.s.updatedAt||0)){
          Store.s=Object.assign(Store.def(),JSON.parse(JSON.stringify(d.state)));
          try{localStorage.setItem(Store.key,JSON.stringify(Store.s))}catch(e){}
          App.refresh();
        }else if((Store.s.updatedAt||0)>(d.updatedAt||0))this.queue();
      }else if(Store.s.updatedAt)this.queue();
    }catch(e){if(e&&e.code&&e.code!=='timeout'&&e.code!=='unavailable')this.ref=null}
  },
  queue(){if(!this.ref)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1800)},
  async flush(){
    if(!this.ref)return;if(this.busy){this.dirty=true;return}
    this.busy=true;
    try{await this.ref.set({updatedAt:Store.s.updatedAt,state:JSON.parse(JSON.stringify(Store.s))})}
    catch(e){if(e&&['invalid_argument','revoked','not_granted','capability_disabled','capability_removed','quota_exceeded'].includes(e.code))this.ref=null}
    this.busy=false;if(this.dirty){this.dirty=false;this.flush()}
  }
};

/* ================= sound ================= */
const Snd={
  ctx:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.out=this.ctx.createGain();this.out.gain.value=.7;this.out.connect(this.ctx.destination)}catch(e){this.ctx=null}},
  live(){if(!this.on)return null;this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  tone(f,dur=.25,o={}){const c=this.live();if(!c)return;const t=c.currentTime+(o.at||0);const os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+dur);const v=o.vol==null?.25:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v,.0002),t+(o.attack||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g);g.connect(o.dest||this.out);os.start(t);os.stop(t+dur+.05)},
  noise(dur=.3,o={}){const c=this.live();if(!c)return;const t=c.currentTime+(o.at||0);const n=Math.floor(c.sampleRate*dur);const b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||1200;const g=c.createGain();g.gain.value=o.vol==null?.25:o.vol;s.connect(f);f.connect(g);g.connect(this.out);s.start(t)},
  pop(){this.tone(560,.12,{type:'triangle',vol:.18,slide:900})},
  tick(){this.tone(1200,.05,{type:'square',vol:.04})},
  good(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,.25,{type:'triangle',vol:.16,at:i*.07}))},
  bad(){this.tone(240,.3,{type:'sawtooth',vol:.07,slide:150})},
  whoosh(){this.noise(.45,{vol:.18,f:1800,type:'bandpass'})},
  boom(){this.noise(.9,{vol:.32,f:420});this.tone(80,.6,{vol:.3,slide:38})},
  crackle(){for(let i=0;i<12;i++)this.noise(.035,{vol:.1,at:.25+Math.random()*.7,f:3500,type:'highpass'})},
  firework(){this.noise(.6,{vol:.08,f:3000,type:'highpass'});this.boom();this.crackle()},
  note(f,dur=.7,vol=.32,at=0){this.tone(f,dur,{vol,at});this.tone(f*2.01,dur*.4,{vol:vol*.18,at});this.tone(f*4,dur*.18,{vol:vol*.08,at})},
  drum(vol=.5,at=0){this.tone(150,.28,{vol,slide:48,at});this.noise(.07,{vol:vol*.3,f:2000,at})},
  splash(){this.noise(.25,{vol:.12,f:2600,type:'bandpass'})}

/* ================= speech ================= */
const Voice={
  en:null,ar:null,
  pick(){try{const vs=speechSynthesis.getVoices();this.en=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|libby|sonia|serena|kate|martha|hazel|uk english female/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;this.ar=vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}},
  say(text,o={}){
    if(o.auto&&!Snd.on)return;
    if(!('speechSynthesis' in window)||!text)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));if(!this.en)this.pick();
      if(o.lang==='ar'){u.lang='ar-SA';if(this.ar)u.voice=this.ar}else{u.lang='en-GB';if(this.en)u.voice=this.en}
      u.rate=o.rate||.88;u.pitch=o.pitch||1.05;u.volume=o.vol==null?1:o.vol;if(o.end)u.onend=o.end;speechSynthesis.speak(u)}catch(e){}
  }
};
if('speechSynthesis' in window){try{speechSynthesis.onvoiceschanged=()=>Voice.pick()}catch(e){}}

/* ================= orbit camera ================= */
class Orbit{
  constructor(cam,el){
    this.cam=cam;this.el=el;this.reset();this.ptrs=new Map();
    el.addEventListener('pointerdown',e=>this.down(e));
    el.addEventListener('pointermove',e=>this.move(e));
    el.addEventListener('pointerup',e=>this.up(e));
    el.addEventListener('pointercancel',e=>{this.ptrs.delete(e.pointerId);this.onUp&&this.onUp(e)});
    el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){this.hover&&this.hover(null)}});
    el.addEventListener('wheel',e=>{if(!this.enabled||!this.zoomable)return;e.preventDefault();this.r=clamp(this.r*Math.exp(e.deltaY*.0012),this.minR,this.maxR);this.idle=0;this.fly=null},{passive:false});

/* quiz: q = {q:html, o:[correct,...wrong], say, en:true(options in English), why, auto:true(read on show)} */
function quiz(el,qs,o={}){
  const n=Math.min(o.n||5,qs.length);const list=shuffle(qs).slice(0,n);let i=0,score=0;const res=[];
  const draw=()=>{
    if(i>=list.length){const pass=score>=Math.ceil(list.length*.6);
      el.innerHTML=`<div class="card q-end" dir="ltr" lang="en"><b class="num">${score} / ${list.length}</b><p>${pass?'Brilliant! You are the hero of this world.':'Good try! Have another go and get '+Math.ceil(list.length*.6)+' right.'}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn hot" type="button" data-again>Try again</button></div></div>`;
      $('[data-again]',el).onclick=()=>quiz(el,qs,o);
      if(pass){if(o.id)award(o.id,'quiz',o.stars||3,'أنهيت التحدي');celebrate()}return}
    const q=list[i];const opts=shuffle(q.o.map((t,j)=>({t,ok:j===0})));
    el.innerHTML=`<div class="card q" dir="ltr" lang="en"><div class="q-top"><span>Question ${i+1} of ${list.length}</span><div class="q-dots">${list.map((_,k)=>`<i class="${res[k]===true?'y':res[k]===false?'n':''}"></i>`).join('')}</div></div>
      <div class="q-prompt">${q.q}${q.say?' '+sayBtn(q.say):''}</div>
      <div class="q-opts">${opts.map((x,k)=>`<button type="button" class="q-opt${q.en?' en-o':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div><div class="q-why" hidden></div></div>`;
    if(q.say&&q.auto!==false)setTimeout(()=>Voice.say(q.say,{auto:true}),250);
    let locked=false;
    $$('.q-opt',el).forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const x=opts[+b.dataset.k];b.classList.add(x.ok?'y':'n');if(!x.ok)$$('.q-opt',el)[opts.findIndex(z=>z.ok)].classList.add('y');res[i]=x.ok;if(x.ok){score++;Snd.good()}else Snd.bad();
      const w=$('.q-why',el);w.hidden=false;w.innerHTML=(x.ok?'<b class="ok">Correct! </b>':'<b class="bad">The right answer is in green. </b>')+(q.why||'')+`<div class="row" style="margin-top:8px"><button class="btn sm hot" type="button" data-next>Next →</button></div>`;
      $('[data-next]',el).onclick=()=>{i++;draw()}});
  };
  draw();
}

<<<
${text.slice(0,1500)}
>>>

2) Start with "🌱 " then ONE small next step in very simple English (max 18 words). Prefer Year 2 targets: capital letters, full stops, using "because" or "and" to join ideas, commas in a list, apostrophes in words like don't and can't, describing words (adjectives), spelling of a tricky word. Quote the exact word or place to fix.

/* keep maths left-to-right inside Arabic sentences: "3 + 1 = 4" never flips */

  const list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(n=>{const s=n.nodeValue;const f=document.createDocumentFragment();let last=0,m;MATH_G.lastIndex=0;while((m=MATH_G.exec(s))){if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));const sp=document.createElement('span');sp.className='num';sp.textContent=m[0];f.appendChild(sp);last=m.index+m[0].length}if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));n.parentNode&&n.parentNode.replaceChild(f,n)})}

/* ================= magpie (school mascot behaviour: Motivated Magpie) ================= */
function makeMagpie(){
  const g=new THREE.Group();const black=G.m('#12141c',{roughness:.45}),white=G.m('#f4f6ff',{roughness:.6}),irid=G.m('#1d3a7a',{metalness:.55,roughness:.28,emissive:'#0a1a44',emissiveIntensity:.35}),teal=G.m('#1f6b6e',{metalness:.55,roughness:.3});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.5,20,14),black);body.scale.set(.85,.8,1.25);g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(.44,20,14),white);belly.scale.set(.82,.7,.95);belly.position.set(0,-.12,.1);g.add(belly);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.33,20,14),black);head.position.set(0,.32,.55);g.add(head);
  const beak=new THREE.Mesh(new THREE.ConeGeometry(.08,.34,10),G.m('#2b2d38'));beak.rotation.x=Math.PI/2;beak.position.set(0,.3,.95);g.add(beak);
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.065,10,8),white);e.position.set(.2*s,.4,.75);g.add(e);const p=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),black);p.position.set(.225*s,.41,.8);g.add(p)});
  const wings=[];[-1,1].forEach(s=>{const piv=new THREE.Group();piv.position.set(.32*s,.12,.05);const w=new THREE.Mesh(new THREE.SphereGeometry(.5,16,10),irid);w.scale.set(1.15,.1,.6);w.position.set(.5*s,0,-.05);piv.add(w);const patch=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),white);patch.scale.set(.9,.09,.45);patch.position.set(.3*s,.045,.05);piv.add(patch);g.add(piv);wings.push({piv,s})});
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.28,.05,1.25),teal);tail.position.set(0,.12,-1.05);tail.rotation.x=-.25;g.add(tail);
  g.userData.flap=(t,amp=.8)=>{wings.forEach(({piv,s})=>{piv.rotation.z=s*Math.sin(t)*amp})};
  g.userData.fold=()=>{wings.forEach(({piv,s})=>{piv.rotation.z=s*-.15})};
  return g;
}

const Dice={
  cache:{},map:[3,4,1,6,2,5],
  tex(n,col){const key=n+'|'+(col||'');if(this.cache[key])return this.cache[key];const S=256;const pip={1:[[.5,.5]],2:[[.27,.27],[.73,.73]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.27,.22],[.73,.22],[.27,.5],[.73,.5],[.27,.78],[.73,.78]]}[n];
    const t=G.tex(S,S,x=>{x.fillStyle=col||'#fdfbf4';x.fillRect(0,0,S,S);x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=10;x.strokeRect(5,5,S-10,S-10);x.fillStyle=n===1?'#d0302f':'#1b1f3a';pip.forEach(([u,v])=>{x.beginPath();x.arc(u*S,v*S,S*.085,0,Math.PI*2);x.fill()})},true);this.cache[key]=t;return t},
  make(size=1,col){const mats=this.map.map(v=>new THREE.MeshStandardMaterial({map:this.tex(v,col),roughness:.35}));const m=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),mats);m.userData.size=size;return m},
  q(v){const q=new THREE.Quaternion();const X=new THREE.Vector3(1,0,0),Z=new THREE.Vector3(0,0,1);
    if(v===6)q.setFromAxisAngle(X,Math.PI);else if(v===3)q.setFromAxisAngle(Z,Math.PI/2);else if(v===4)q.setFromAxisAngle(Z,-Math.PI/2);else if(v===2)q.setFromAxisAngle(X,-Math.PI/2);else if(v===5)q.setFromAxisAngle(X,Math.PI/2);return q},
  roll(die,v,o={}){const target=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rand(-.5,.5)).multiply(this.q(v));const te=new THREE.Euler().setFromQuaternion(target);const sp=o.spin||3;
    const e0={x:te.x+Math.PI*2*randi(1,sp)*(Math.random()<.5?-1:1)+rand(-1,1),y:te.y+Math.PI*2*randi(1,sp)+rand(-1,1),z:te.z+Math.PI*2*randi(1,sp)*(Math.random()<.5?-1:1)+rand(-1,1)};
    const y1=o.h==null?die.userData.size/2:o.h;const y0=y1+(o.lift||3);Snd.noise(.2,{vol:.08,f:900});
    E.anim(1.1,k=>{die.rotation.set(e0.x+(te.x-e0.x)*Ease.out(k),e0.y+(te.y-e0.y)*Ease.out(k),e0.z+(te.z-e0.z)*Ease.out(k))});
    return E.anim(1.1,k=>{die.position.y=y0+(y1-y0)*Ease.bounce(k)}).then(()=>{Snd.tick();return v})}
};
const numTex=(n,bg,fg)=>G.glyph(String(n),{bg:bg||'#ffffff',fg:fg||'#16204a',font:FONT_D,size:String(n).length>2?80:String(n).length>1?120:160});
function arc(obj,to,dur=.7,h=1.5,ease=Ease.inOut){const f=obj.position.clone();return E.anim(dur,k=>{obj.position.set(lerp(f.x,to.x,k),lerp(f.y,to.y,k)+Math.sin(Math.PI*k)*h,lerp(f.z,to.z,k))},ease)}

world({id:'blocks',d:'maths',ar:'مصنع العشرات والآحاد',en:'Tens & Ones Factory',icon:'🧱',color:'#ffd166',blurb:'جمع وطرح عددين من رقمين مع "التبديل" (exchange)',goals:['learn','show','play','quiz'],
  build(ctx){

      for(let f=0;f<2;f++)for(let r=0;r<2;r++)for(let c=0;c<5;c++){const X=466+c*55+f*277,Y=112+r*55;x.strokeRect(X-24,Y-24,48,48)}x.fillStyle='rgba(255,255,255,.75)';x.font='700 44px '+FONT_R;x.fillText('Tens',150,70);x.fillText('Ones',660,70)});
    const mat=G.mesh(new THREE.PlaneGeometry(12,6),new THREE.MeshStandardMaterial({map:matTex,roughness:.95}));mat.rotation.x=-Math.PI/2;mat.position.set(.4,.01,.1);scene.add(mat);
    const rodTex=G.tex(64,640,x=>{x.fillStyle='#ffffff';x.fillRect(0,0,64,640);x.strokeStyle='rgba(0,0,30,.45)';x.lineWidth=5;for(let i=1;i<10;i++){x.beginPath();x.moveTo(0,i*64);x.lineTo(64,i*64);x.stroke()}x.strokeRect(2,2,60,636)});

    const cubeTex=G.tex(64,64,x=>{x.fillStyle='#fff';x.fillRect(0,0,64,64);x.strokeStyle='rgba(0,0,30,.4)';x.lineWidth=6;x.strokeRect(3,3,58,58)});
    const mkOne=c=>new THREE.Mesh(new THREE.BoxGeometry(u*.92,u*.92,u*.92),new THREE.MeshStandardMaterial({color:c,map:cubeTex,roughness:.45}));
    const tPos=(i,row)=>new THREE.Vector3(-4.6+i*.44,ROD/2+.02,rowZ[row]);
    const oPos=(i,row)=>{const f=Math.floor(i/10),k=i%10,r=Math.floor(k/5),c=k%5;return new THREE.Vector3(.75+c*.44+f*2.45,u/2+.02,rowZ[row]+(r-.5)*.44)};
    const eq=G.label('27 + 15 = ?',{size:1.05,color:'#ffd166',stroke:'#140c00',px:80,font:FONT_D});eq.position.set(.4,4.6,-2.6);scene.add(eq);
    const cntT=G.label('Tens: 0',{size:.62,color:'#fff',bg:'rgba(7,11,31,.8)',px:50}),cntO=G.label('Ones: 0',{size:.62,color:'#fff',bg:'rgba(7,11,31,.8)',px:50});cntT.position.set(-3.2,.45,2.7);cntO.position.set(2.9,.45,2.7);scene.add(cntT,cntO);
    const grp=new THREE.Group();scene.add(grp);
    let S=null,busy=false;
    orbit.setHome({target:new THREE.Vector3(.4,1,.3),r:Math.max(12,E.fitR(15.5)),theta:0,phi:.9});orbit.minR=6;orbit.maxR=28;orbit.maxPhi=1.35;
    const counts=()=>{cntT.userData.set('Tens: '+S.tens.length);cntO.userData.set('Ones: '+S.ones.length)};
    function setup(op,A,B){while(grp.children.length)grp.remove(grp.children[0]);S={op,A,B,step:0,tens:[],ones:[],bT:[],bO:[],ghost:[]};const a=[Math.floor(A/10),A%10],b=[Math.floor(B/10),B%10];
      for(let i=0;i<a[0];i++){const r=mkRod(colA);r.position.copy(tPos(i,'A'));r.position.y+=6+i*.3;grp.add(r);S.tens.push(r);E.tw(r.position,{y:ROD/2+.02},.7+i*.05,Ease.bounce)}
      for(let i=0;i<a[1];i++){const c=mkOne(colA);c.position.copy(oPos(i,'A'));c.position.y+=5+i*.2;grp.add(c);S.ones.push(c);E.tw(c.position,{y:u/2+.02},.7+i*.04,Ease.bounce)}

    async function exchangeUp(){// 10 ones -> 1 ten

function deformPts(base,arr,act,a,len){const k=a*(Math.PI*.55)/(len/2);for(let i=0;i<arr.length;i+=3){let x=base[i],y=base[i+1],z=base[i+2];
  if(act==='squash'){y*=1-.6*a;x*=1+.32*a;z*=1+.32*a}
  else if(act==='stretch'){x*=1+.8*a;y*=1-.28*a;z*=1-.28*a}
  else if(act==='bend'&&k>1e-4){const th=x*k;const r=1/k;const nx=Math.sin(th)*(r-y),ny=r-Math.cos(th)*(r-y);x=nx;y=ny-0}
  else if(act==='twist'){const ph=x/(len/2)*a*Math.PI*.9;const c=Math.cos(ph),s=Math.sin(ph);const ny=y*c-z*s,nz=y*s+z*c;y=ny;z=nz}
  else if(act==='crumple'){const n=Math.sin(x*9+z*7)*Math.cos(z*11-x*5);x*=1-.45*a;z*=1-.45*a;y+=n*.35*a}
  arr[i]=x;arr[i+1]=y;arr[i+2]=z}}

function mannequin(col){
  const mt=G.m(col||'#6db4ff',{roughness:.5}),sk=G.m('#f2c8a0',{roughness:.7}),dk=G.m('#1b2a5a',{roughness:.6});
  const seg=(len,r,m)=>{const piv=new THREE.Group();const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,12),m);c.position.y=-len/2;piv.add(c);const j=new THREE.Mesh(new THREE.SphereGeometry(r*1.05,12,10),m);piv.add(j);const end=new THREE.Group();end.position.y=-len;piv.add(end);piv.userData.end=end;return piv};
  const root=new THREE.Group();const spine=new THREE.Group();root.add(spine);const torso=new THREE.Mesh(new THREE.CylinderGeometry(.24,.2,.7,14),mt);torso.position.y=.37;spine.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.2,18,14),sk);head.position.y=.95;spine.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.205,18,14,0,Math.PI*2,0,Math.PI*.5),dk);hair.position.y=.97;hair.rotation.x=-.3;spine.add(hair);
  const J={root,spine};[['lSh',.3,.66,mt,.36,.075,'lEl',.33,sk],['rSh',-.3,.66,mt,.36,.075,'rEl',.33,sk]].forEach(([n,x,y,m,l1,r,n2,l2,m2])=>{const a=seg(l1,r,m);a.position.set(x,y,0);spine.add(a);const b=seg(l2,r*.85,m2);a.userData.end.add(b);J[n]=a;J[n2]=b});
  [['lHip',.12,dk,'lKn'],['rHip',-.12,dk,'rKn']].forEach(([n,x,m,n2])=>{const a=seg(.48,.095,m);a.position.set(x,0,0);root.add(a);const b=seg(.48,.08,sk);a.userData.end.add(b);J[n]=a;J[n2]=b;const foot=G.box(.12,.08,.22,'#ffffff');foot.position.set(0,-.02,.06);b.userData.end.add(foot)});
  return J;
}

/* =====================================================================
   THE 3D BOOK · v2
   An English picture book on a desk (it opens left to right, like the books at school).
   Every world has two spreads:
     1. Learn | Try it   — the lesson with a lift-the-flap question, and a pop-up model.
     2. Practise | Quiz  — a game printed on the page with the booklet's home learning, and a quiz.
   Everything you press lives on the page: 3D buttons under each model, a sticky note that answers
   back, and little "Tap" / "Drag" tags sitting on the things to touch. Arabic is kept to short notes.
   ===================================================================== */
const BK={W:4.2,H:5.6,T:.008,GUT:.28,BD:.07,OV:.12,PW:1024,PH:1366,N:30,MIR:-1};
const PINK='#2d2219',PINK2='#6b5847',PAPER='#fbf4e2';
const BMATH=/(?:[□?؟]|\d+)(?:\s*[+\-−×÷=<>]\s*(?:[□?؟]|\d+))+/g;
const CH_INK={english:'#2f6fb3',maths:'#a3690b',science:'#16866b',past:'#c04c17',tech:'#6648c2',heart:'#c0336a'};
const CH_TINT={english:'#e2edfa',maths:'#faeccc',science:'#d8f2e8',past:'#fce0cf',tech:'#e9e3fb',heart:'#fadfe9'};
const CH_EN={english:'English',maths:'Maths',science:'Science',past:'History · Design & Technology',tech:'Computing · Music · PE',heart:'RE · PSHE · Values'};
const CH_AR={english:'الإنجليزي',maths:'الرياضيات',science:'العلوم',past:'التاريخ والتصميم',tech:'الحاسوب والموسيقى والرياضة',heart:'القيم والتربية الدينية'};

const phys=s=>BK.MIR<0?(s==='R'?'L':'R'):s;
const stripTags=s=>String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
const BookData=()=>{const s=Store.s;if(!s.book||typeof s.book!=='object')s.book={};const b=s.book;['stamps','stickers','quiz','games','home'].forEach(k=>{if(!b[k]||typeof b[k]!=='object')b[k]={}});b.at=b.at||0;return b};
const EN_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],EN_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const enDate=d=>EN_DAYS[d.getDay()]+' '+d.getDate()+' '+EN_MON[d.getMonth()];

/* ---------- canvas print helpers ---------- */
const PT={
  fnt(x,sz,wt,fam){x.font=(wt||400)+' '+sz+'px '+(fam||FONT_B)},
  rtl(x){x.direction='rtl';x.textAlign='right'},
  ltr(x,al){x.direction='ltr';x.textAlign=al||'left'},
  bx(s){return String(s).replace(BMATH,m=>'⁦'+m.replace(/ /g,' ')+'⁩')},
  wrap(x,s,max){const out=[];PT.bx(s).split('\n').forEach(par=>{const ws=par.split(/[ \t]+/).filter(Boolean);let line='';ws.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>max&&line){out.push(line);line=w}else line=t});out.push(line)});return out},
  /* English paragraph (left to right) */
  en(x,s,X,y,max,o={}){const sz=o.sz||30,lh=o.lh||1.5;PT.fnt(x,sz,o.wt||400,o.fam||FONT_R);x.fillStyle=o.col||PINK;PT.ltr(x,o.al);const ls=PT.wrap(x,s,max);if(!o.dry)ls.forEach((l,i)=>x.fillText(l,X,y+i*sz*lh));return {y:y+ls.length*sz*lh,n:ls.length,h:ls.length*sz*lh}},
  /* short Arabic note (right to left, right-aligned inside [X0,X1]) */
  ar(x,s,X0,X1,y,o={}){if(!s)return {y,n:0,h:0};const sz=o.sz||20,lh=o.lh||1.5;PT.fnt(x,sz,o.wt||400,FONT_B);x.fillStyle=o.col||PINK2;PT.rtl(x);const ls=PT.wrap(x,s,X1-X0);const ax=o.align==='center'?(X0+X1)/2:X1;if(o.align==='center')x.textAlign='center';if(!o.dry)ls.forEach((l,i)=>x.fillText(l,ax,y+i*sz*lh));return {y:y+ls.length*sz*lh,n:ls.length,h:ls.length*sz*lh}},
  rr(x,X,Y,W,H,R){G.rr(x,X,Y,W,H,R)},
  box(x,X,Y,W,H,R,fill,stroke,lw,dash){x.save();if(fill){x.fillStyle=fill;PT.rr(x,X,Y,W,H,R);x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||3;if(dash)x.setLineDash(dash);PT.rr(x,X,Y,W,H,R);x.stroke()}x.restore()},
  noise:null,
  base(x,ps,o={}){
    x.fillStyle=o.bg||PAPER;x.fillRect(0,0,BK.PW,BK.PH);
    if(!PT.noise)PT.noise=G.canvas(256,256,n=>{const d=n.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()<.5?60:250;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()<.45?9:0}n.putImageData(d,0,0)});
    x.save();x.fillStyle=x.createPattern(PT.noise,'repeat');x.fillRect(0,0,BK.PW,BK.PH);x.restore();
    if(ps){const gx=ps==='R'?0:BK.PW,dir=ps==='R'?1:-1;const g=x.createLinearGradient(gx,0,gx+dir*170,0);g.addColorStop(0,'rgba(84,58,30,.34)');g.addColorStop(.3,'rgba(84,58,30,.09)');g.addColorStop(1,'rgba(84,58,30,0)');x.fillStyle=g;x.fillRect(ps==='R'?0:BK.PW-170,0,170,BK.PH);
      const ox=ps==='R'?BK.PW:0;const g2=x.createLinearGradient(ox,0,ox-dir*36,0);g2.addColorStop(0,'rgba(84,58,30,.14)');g2.addColorStop(1,'rgba(84,58,30,0)');x.fillStyle=g2;x.fillRect(ps==='R'?BK.PW-36:0,0,36,BK.PH)}
  },
  /* margins: the outer edge gets 84px, the spine side 140px */
  lay(ps){return ps==='L'?{X0:84,X1:BK.PW-140}:{X0:140,X1:BK.PW-84}},
  squiggle(x,X0,X1,y,col,w=4){x.save();x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();for(let X=X0;X<=X1;X+=6){const yy=y+Math.sin(X*.09)*4;X===X0?x.moveTo(X,yy):x.lineTo(X,yy)}x.stroke();x.restore()},
  dashCircle(x,cx,cy,r,col){x.save();x.setLineDash([10,9]);x.lineWidth=3;x.strokeStyle=col;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.restore()},
  pageNo(x,n,ps){if(!n)return;PT.fnt(x,26,700,FONT_D);x.fillStyle=PINK2;PT.ltr(x,ps==='R'?'right':'left');x.fillText(String(n),ps==='R'?BK.PW-60:60,BK.PH-34)},
  icon(x,ch,cx,cy,sz){x.fillStyle='#000000';PT.fnt(x,sz,400,'"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif');x.textAlign='center';x.direction='ltr';x.textBaseline='middle';x.fillText(ch,cx,cy+sz*.04);x.textBaseline='alphabetic'},
  fitFont(x,txt,max,sz,wt,fam,min=14){PT.fnt(x,sz,wt,fam);while(x.measureText(txt).width>max&&sz>min){sz-=2;PT.fnt(x,sz,wt,fam)}return sz},
  stampMark(x,cx,cy,r,col,ico){x.save();x.translate(cx,cy);x.rotate(-.22);x.globalAlpha=.86;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=r*.12;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke();x.lineWidth=r*.05;x.beginPath();x.arc(0,0,r*.8,0,Math.PI*2);x.stroke();

function drawTO(x,r,t,o){const cs=Math.min(20,(r.h-50)/10);const top=r.y+(r.h-cs*10)/2-8;const tw=t*(cs+14)+(o?24+5*(cs+8):0);let X=r.x+r.w/2-tw/2;
  for(let i=0;i<t;i++){for(let k=0;k<10;k++){x.fillStyle='#ffb84d';x.fillRect(X,top+k*cs,cs,cs);x.strokeStyle='#8a5a10';x.lineWidth=1.5;x.strokeRect(X,top+k*cs,cs,cs)}X+=cs+14}
  X+=24;for(let i=0;i<o;i++){const c=i%5,rr=Math.floor(i/5);const cx=X+c*(cs+8),cy=top+cs*6+rr*(cs+8);x.fillStyle='#7cc4ff';x.fillRect(cx,cy,cs,cs);x.strokeStyle='#1d4f9e';x.lineWidth=1.5;x.strokeRect(cx,cy,cs,cs)}
  PT.fnt(x,20,700,FONT_R);PT.ltr(x,'center');x.fillStyle=PINK2;x.fillText('tens = sticks · ones = cubes',r.x+r.w/2,r.y+r.h-14)}
function drawShape2(x,cx,cy,s,type){const R=s*.42;x.save();x.fillStyle='#c9b8ff';x.strokeStyle=PINK;x.lineWidth=4;x.lineJoin='round';x.beginPath();
  const poly=(n,rot)=>{for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;const px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()};
  if(type==='square')poly(4,Math.PI/4);else if(type==='rectangle')x.rect(cx-R*1.2,cy-R*.62,R*2.4,R*1.24);else if(type==='triangle')poly(3,-Math.PI/2);else if(type==='pentagon')poly(5,-Math.PI/2);else if(type==='hexagon')poly(6,0);else if(type==='circle')x.arc(cx,cy,R,0,7);
  else if(type==='kite'){x.moveTo(cx,cy-R);x.lineTo(cx+R*.62,cy-R*.18);x.lineTo(cx,cy+R);x.lineTo(cx-R*.62,cy-R*.18);x.closePath()}else if(type==='rhombus'){x.moveTo(cx,cy-R);x.lineTo(cx+R*.72,cy);x.lineTo(cx,cy+R);x.lineTo(cx-R*.72,cy);x.closePath()}

function drawSolid(x,cx,cy,s,type){const R=s*.36;x.save();x.lineWidth=3;x.strokeStyle=PINK;x.lineJoin='round';const col={sphere:'#ff8fb1',cylinder:'#6db4ff',cone:'#ffd166',cube:'#ff7b39',cuboid:'#3ddbb0',pyramid:'#b29bff'}[type]||'#ccc';

  else if(type==='cube'||type==='cuboid'){const w=type==='cube'?R*1.1:R*1.5,h=R*1.1,d=R*.5;const X0=cx-w/2-d/2,Y0=cy-h/2+d/2;x.fillStyle=col;x.fillRect(X0,Y0,w,h);x.strokeRect(X0,Y0,w,h);x.fillStyle=shade(col,1.2);x.beginPath();x.moveTo(X0,Y0);x.lineTo(X0+d,Y0-d);x.lineTo(X0+d+w,Y0-d);x.lineTo(X0+w,Y0);x.closePath();x.fill();x.stroke();
    x.fillStyle=shade(col,.75);x.beginPath();x.moveTo(X0+w,Y0);x.lineTo(X0+w+d,Y0-d);x.lineTo(X0+w+d,Y0-d+h);x.lineTo(X0+w,Y0+h);x.closePath();x.fill();x.stroke()}

WC.shapes2d={
  learn:{body:['2D shapes are flat shapes.','Sides are the straight lines. Vertices (corners) are where two sides meet.','A line of symmetry cuts a shape into two halves that match exactly. Fold on the line and the halves fit on top of each other.','A square has 4 lines of symmetry. A rectangle has only 2: the diagonal does not work!'],

  try:{hint:'Choose a shape, then press Fold to fold it on a line of symmetry. Try the wrong fold on the rectangle!',ar:'اختر شكلاً واضغط Fold لتطويه.',

      const SH=[['square',{n:4,R:1.2,rot:Math.PI/4},4,4,4],['rectangle',{rect:[2.5,1.35]},4,4,2],['triangle',{n:3,R:1.3,rot:Math.PI/2},3,3,3],['pentagon',{n:5,R:1.2},5,5,5],['hexagon',{n:6,R:1.2,rot:0},6,6,6],['circle',{R:1.15},0,0,'lots']];
      let cur=0,axis=0,busy=false,folds=0;const holder=new THREE.Group();holder.position.set(0,.03,-.05);P.root.add(holder);let parts=null,tagged=false;
      const shp=pts=>{const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));s.closePath();return s};
      function make(a){if(parts){untap(parts.g);P.untag(parts.g);PK.disposeTree(parts.g);holder.remove(parts.g)}const sd=SH[cur][1];const base=polyPts(sd);const rot=Math.PI/2-a,c=Math.cos(rot),s=Math.sin(rot);const rp=base.map(([x,y])=>[x*c-y*s,x*s+y*c]);

WC._end={
  ink:false,scale:1,
  pop(P){
    const g=new THREE.Group();P.root.add(g);for(let i=0;i<9;i++){const a=i/9*Math.PI*2;const s=G.mesh(new THREE.DodecahedronGeometry(.1),G.m('#6b6f86',{flatShading:true}));s.position.set(Math.cos(a)*.34,.06,Math.sin(a)*.24);g.add(s)}
    for(let i=0;i<4;i++){const l=G.cyl(.04,.05,.5,'#6a4128');l.rotation.z=Math.PI/2.6;l.rotation.y=i*Math.PI/2;l.position.y=.14;g.add(l)}

      <label class="ai-row"><input type="checkbox" id="aiFast"${c.fast!==false?' checked':''}> <span>Fastest provider first (learns which one answers quickest here)</span></label>
      <label class="ai-field"><span>First choice</span><select id="aiFirst"><option value="auto"${c.first==='auto'?' selected':''}>Automatic (MusabAI order)</option>${AI_SPECS.filter(s=>!s.custom).map(opt).join('')}</select></label>
      <h4>Free keys (optional)</h4><p class="note">Kilo Auto Free and AI Horde need no key. A free key from another provider makes Bright faster and more reliable.</p>
      ${AI_KEYS.map(([k,n])=>{const s=AI_SPECS.find(x=>x.secret===k);return `<label class="ai-field"><span>${esc(n)}${s&&s.site?` <small>${esc(s.site)}</small>`:''}</span><input type="password" data-key="${k}" value="${esc(c.keys[k]||'')}" autocomplete="off" spellcheck="false" placeholder="paste key"></label>`}).join('')}
      <h4>Your own endpoint</h4><p class="note">Any OpenAI-compatible service (https only).</p>
      <label class="ai-field"><span>Base URL</span><input id="aiCB" value="${esc(c.custom.base||'')}" placeholder="https://…/v1" spellcheck="false"></label>
      <label class="ai-field"><span>Model</span><input id="aiCM" value="${esc(c.custom.model||'')}" spellcheck="false"></label>
      <label class="ai-field"><span>Key</span><input id="aiCK" type="password" value="${esc(c.custom.key||'')}" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="btn hot" type="button" id="aiSave">Save</button><button class="btn ghost" type="button" id="aiTest">Test the AI</button><button class="btn ghost" type="button" id="aiReset">Reset</button></div>
      <p class="ai-test" id="aiTestOut" aria-live="polite"></p>
      <h4>Providers now</h4><ul class="ai-list" id="aiList"></ul>
      <p class="note">Privacy: Bright sends the text of the page and the question, never the child's name. Free services may keep what is typed. Free tiers have limits, so Bright cannot promise an answer every time.</p>
      <p class="ar-note" dir="rtl" lang="ar">الخصوصية: يرسل الكتاب نص الصفحة والسؤال فقط، ولا يرسل اسم الطفل. الخدمات المجانية قد تحتفظ بما يُكتب ولها حدود استخدام.</p>`);
    const el=this.el;const list=()=>{$('#aiList',el).innerHTML=BookAI.order().filter((s,i,a)=>a.findIndex(x=>x.id===s.id)===i).map(s=>{const st=BookAI.status(s);return `<li><span>${esc(s.name)}</span><i class="st ${st.c}">${esc(st.t)}</i></li>`}).join('')};list();
    const read=()=>{c.on=$('#aiOn',el).checked;c.voice=$('#aiVoice',el).checked;c.fast=$('#aiFast',el).checked;c.first=$('#aiFirst',el).value;$$('[data-key]',el).forEach(i=>{c.keys[i.dataset.key]=i.value.trim()});c.custom={base:$('#aiCB',el).value.trim(),model:$('#aiCM',el).value.trim(),key:$('#aiCK',el).value.trim()};BookAI.save();list()};
    $('#aiSave',el).onclick=()=>{read();toast('Saved ✓');this.close()};
    $('#aiReset',el).onclick=()=>{BookAI.reset();list();$('#aiTestOut',el).textContent='Provider health cleared.'};
    $('#aiTest',el).onclick=async()=>{read();const out=$('#aiTestOut',el);out.textContent='Testing…';const t0=performance.now();
      try{const r=await BookAI.chat([{role:'system',content:AI_RULES},{role:'user',content:'Say hello to a Year 2 child in one short sentence.'}],{max:60});out.textContent=`✓ ${r.provider.name} answered in ${((performance.now()-t0)/1000).toFixed(1)} s: "${aiCleanOut(r.text).slice(0,120)}"`}
      catch(e){out.textContent='No AI answered right now. The book will answer from its pages. '+(e.errors&&e.errors.length?'('+e.errors.join(' | ').slice(0,300)+')':'')}list()}}
};
/* the Android back button: close what is open, then go back toward the cover, then leave */
window.BookBack=function(){try{if(AISettings.isOpen()){AISettings.close();return true}if(Bright.isOpen()){Bright.close();return true}if(Overlay.open){Overlay.read(false);return true}
  if(App.cur!=='home'){App.go('home');return true}const st=Book.st;if(st&&st.turned>1){st.go(1,'L');return true}if(st&&st.turned===1){st.go(0);return true}}catch(e){}return false};
/* the Android app speaks with the phone's own voice (WebView has no speechSynthesis), and saves files to Downloads */
if(window.BookNative&&typeof BookNative.speak==='function'){const say0=Voice.say.bind(Voice);let tid=0;const ends={};
  window.__bookTtsDone=id=>{const f=ends[id];delete ends[id];if(f)try{f()}catch(e){}};
  Voice.say=function(text,o={}){if(o.auto&&!Snd.on)return;if(!text)return;const id='u'+(++tid);if(o.end)ends[id]=o.end;
    try{BookNative.speak(String(text),o.lang==='ar'?'ar':'en-GB',Number(o.rate||.88),Number(o.pitch||1.05),id)}catch(e){delete ends[id];say0(text,o)}}}
if(window.BookNative&&typeof BookNative.saveFile==='function'){const save0=saveFile;
  saveFile=async function(name,blob){try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});BookNative.saveFile(String(name),blob.type||'application/octet-stream',b64)}catch(e){return save0(name,blob)}}}
window.__bookSaved=(ok,msg)=>toast(ok?'Saved to Downloads ✓':'Could not save'+(msg?': '+msg:''));
(()=>{const b0=App.book;App.book=function(){const r=b0.apply(this,arguments);AISettings.el=null;BrightBar.mount();BookAI.warm();return r};
  const r0=App.route;App.route=function(){AISettings.close();const ba=$('#brightAsk');if(ba)ba.remove();try{window.BookNative&&BookNative.stop&&BookNative.stop()}catch(e){}return r0.apply(this,arguments)}})();
BookAI.load();

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>App.boot());else App.boot();

</script>
