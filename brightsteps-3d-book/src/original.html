<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrightSteps 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="كتيّب Year 2 · Autumn 2 كعالم تعليمي ثلاثي الأبعاد: صوتيات، كلمات صعبة، قراءة، كتابة، رياضيات، أشكال، علوم، تاريخ، تصميم، حاسوب، موسيقى، رياضة، وقيم.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Readex+Pro:wght@300;400;600&display=swap">
<style>
:root{
  /* Layout: a floating toy-town under a Bonfire-Night sky. One 3D stage travels from world to world; a reading sheet docks beside it (below it on phones). */
  --sky0:#070b1f; --sky1:#0d1434; --panel:#121a3e; --panel2:#1a2352; --panel3:#222d63; --line:#2a3672;
  --ink:#f3f5ff; --ink2:#c9d0f3; --muted:#949fd0;
  --ember:#ff7b39; --ember2:#ffb04d; --gold:#ffd166; --mint:#3ddbb0; --berry:#ff5d8f; --sky:#6db4ff; --violet:#b29bff;
  --shadow:0 18px 40px rgba(2,4,18,.55);
  --f-display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-read:"Andika","Readex Pro","Trebuchet MS",system-ui,sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutR:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{background:var(--sky0);color:var(--ink)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.75;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sky0)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-read)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;
  padding-block:9px;padding-left:var(--gut);padding-right:var(--gutR);
  background:rgba(7,11,31,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(64,80,160,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;background:none;border:0;padding:0;text-align:start;overflow:hidden}
.brand>span:last-child{min-width:0;overflow:hidden}
.mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  background:conic-gradient(from 200deg,var(--ember),var(--gold),var(--berry),var(--violet),var(--ember));box-shadow:0 0 0 2px #0b1230 inset,0 6px 18px rgba(255,123,57,.35)}
.mark i{width:22px;height:22px;background:var(--sky0);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.2px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b em{font-style:normal;color:var(--ember2)}
.brand small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;background:#1d1a3a;border:1px solid #4a3a5e;color:var(--gold);font-weight:700;font-family:var(--f-display);font-size:16px;white-space:nowrap}
.pill .star{width:16px;height:16px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:0 0 auto;transition:transform .15s}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--ember);border-color:var(--ember);color:#1b0c02}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-family:var(--f-display);font-size:16px;line-height:1.2;
  background:var(--panel3);color:var(--ink);box-shadow:0 4px 0 #0c1233;transition:transform .12s,box-shadow .12s,filter .15s;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1233}
.btn.hot{background:linear-gradient(180deg,#ff9150,var(--ember));color:#2a1003;box-shadow:0 4px 0 #a43f10}
.btn.hot:active{box-shadow:0 1px 0 #a43f10}
.btn.mint{background:linear-gradient(180deg,#5ef0c8,var(--mint));color:#062a20;box-shadow:0 4px 0 #13836a}
.btn.gold{background:linear-gradient(180deg,#ffe08f,var(--gold));color:#3a2600;box-shadow:0 4px 0 #a9822a}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:0;background:#22306b;color:var(--sky);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;vertical-align:middle;flex:0 0 auto}
.say svg{width:18px;height:18px;fill:currentColor}

/* ---------- home ---------- */
.hub{position:relative}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#1a2563 0,#0c1234 55%,#070b1f 100%);touch-action:pan-y}
.stage>canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline:none}
.hub .stage{height:clamp(380px,64vh,660px)}
.ovl{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;pointer-events:none}
.ov-top{padding:12px var(--gutR) 0 var(--gut);display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.ov-top>*{pointer-events:auto}
.ov-cap{padding:0 var(--gutR) 8px var(--gut);display:flex;justify-content:center;pointer-events:none}
.cap{max-width:520px;background:rgba(7,11,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(110,130,230,.28);border-radius:14px;padding:7px 14px;text-align:center;font-size:14px;line-height:1.55;color:var(--ink2)}
.cap b{color:var(--ink);font-weight:600}
.cap .en{display:block;color:var(--gold);font-size:16px}
.cap:empty{display:none}
.ov-bar{padding:6px var(--gutR) 12px var(--gut);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;
  background:linear-gradient(0deg,rgba(7,11,31,.85),rgba(7,11,31,0))}
.ov-bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(140,160,255,.35);background:rgba(18,26,62,.85);color:var(--ink);border-radius:99px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.2;min-height:40px;white-space:nowrap;transition:background .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ember);border-color:var(--ember);color:#2a1003}
.chip.go{background:var(--mint);border-color:var(--mint);color:#062a20}
.chip.gold{background:var(--gold);border-color:var(--gold);color:#3a2600}
.chip .en{font-family:inherit}
.ov-free{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px var(--gutR) 8px var(--gut);overflow:hidden;pointer-events:none}
.wtitle{background:rgba(7,11,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(110,130,230,.28);border-radius:14px;padding:6px 12px;line-height:1.25;min-width:0}
.wtitle b{font-family:var(--f-display);font-size:17px;display:block}
.wtitle span{font-size:12px;color:var(--gold);font-family:var(--f-read)}
.ov-top .sp{flex:1}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2);z-index:2}

.hub-hello{position:absolute;z-index:3;top:16px;right:var(--gutR);left:var(--gut);pointer-events:none}
.hub-hello h1{font-size:clamp(26px,4.6vw,46px);letter-spacing:-.3px;text-shadow:0 4px 24px rgba(0,0,0,.6);max-width:14ch}
.hub-hello h1 em{font-style:normal;color:var(--ember2)}
.hub-hello p{color:var(--ink2);max-width:38ch;font-size:14px;text-shadow:0 2px 12px rgba(0,0,0,.8)}

.wrap{padding-left:var(--gut);padding-right:var(--gutR);padding-block:22px 40px;max-width:1240px;margin:0 auto}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h small{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.wk small{color:var(--muted);display:block;font-size:12px}
.wk b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.2;margin:2px 0}
.wk span{font-size:13px;color:var(--ink2);display:block}
.wk.hot{border-color:#7a3a1c;background:linear-gradient(160deg,#2a1730,var(--panel))}
.wk.hot b{color:var(--ember2)}
.district{margin-top:18px}
.district h3{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.district h3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.wc{position:relative;text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s;overflow:hidden}
.wc:hover{transform:translateY(-2px);border-color:#5262b8}
.wc .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.wc b{font-family:var(--f-display);font-size:16px;line-height:1.3}
.wc .en{font-size:13px;color:var(--gold)}
.wc small{color:var(--muted);font-size:12px;line-height:1.5}
.wc .meter{margin-top:auto;height:6px;border-radius:9px;background:#0b1130;overflow:hidden}
.wc .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:9px}
.wc .done{position:absolute;top:10px;left:10px;font-size:12px;color:var(--mint);font-weight:700}

/* ---------- world ---------- */
.world{display:grid;grid-template-columns:minmax(0,1fr) 450px;min-height:calc(100vh - 59px)}
.world .stage{position:sticky;top:calc(59px + env(safe-area-inset-top,0px));height:calc(100vh - 59px - env(safe-area-inset-top,0px));grid-column:1;grid-row:1}
.sheet{grid-column:2;grid-row:1;background:var(--sky1);border-inline-start:1px solid var(--line);min-width:0}
.tabs{display:flex;gap:6px;padding:12px var(--gutR) 10px var(--gut);position:sticky;top:calc(59px + env(safe-area-inset-top,0px));z-index:5;background:var(--sky1);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;min-height:42px}
.tab.on{background:var(--panel3);color:var(--ink)}
.tabbody{padding:16px var(--gutR) 60px var(--gut);display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.card h4{font-size:16px;margin:10px 0 6px;color:var(--ink)}
.card p,.card li{color:var(--ink2);font-size:14.5px}
.card ul,.card ol{margin:6px 0 0;padding-inline-start:20px}
.card li{margin:3px 0}
.card.glow{border-color:#6c4a2a;background:linear-gradient(170deg,#2b1c2f,var(--panel) 60%)}
.kicker{font-size:12px;letter-spacing:.6px;color:var(--ember2);font-weight:600;display:block;margin-bottom:4px}
.big-en{font-family:var(--f-read);direction:ltr;font-size:20px;color:var(--ink);line-height:1.5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big-en .say{margin-inline-start:auto}
.enline{display:flex;align-items:center;gap:10px;background:#0f1638;border:1px solid #26326a;border-radius:12px;padding:8px 10px;margin:8px 0;direction:ltr}
.enline span{font-family:var(--f-read);font-size:17px;color:var(--ink);flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.warn{background:#2c1a14;border:1px solid #7a3a1c;border-radius:14px;padding:10px 12px;color:#ffd9c2;font-size:14px}
.ok{color:var(--mint)} .bad{color:var(--berry)} .gold-t{color:var(--gold)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#18214d;color:var(--ink);font-weight:600;font-size:13px}
td{color:var(--ink2)}
tr:last-child td{border-bottom:0}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vw{display:inline-flex;align-items:center;gap:6px;background:#0f1638;border:1px solid #26326a;border-radius:11px;padding:4px 6px 4px 10px;font-size:13px}
.vw b{font-family:var(--f-read);direction:ltr;color:var(--ink);font-size:15px}
.vw .say{width:28px;height:28px}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.q-dots{display:flex;gap:4px}
.q-dots i{width:22px;height:6px;border-radius:9px;background:#26306a}
.q-dots i.y{background:var(--mint)} .q-dots i.n{background:var(--berry)}
.q-prompt{font-family:var(--f-display);font-size:20px;line-height:1.45;color:var(--ink)}
.q-prompt .en{font-size:22px;color:var(--gold)}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.q-opt{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;min-height:58px;font-size:17px;font-family:var(--f-display);font-weight:700;color:var(--ink);transition:transform .12s}
.q-opt.en-o{font-family:var(--f-read)}
.q-opt:active{transform:scale(.97)}
.q-opt.y{border-color:var(--mint);background:#0f3b37;color:#c6fff0}
.q-opt.n{border-color:var(--berry);background:#3a1430;color:#ffd0e0}
.q-why{font-size:14px;color:var(--ink2);background:#0f1638;border-radius:12px;padding:10px 12px;border:1px solid #26326a}
.q-end{text-align:center;padding:10px}
.q-end b{font-family:var(--f-display);font-size:42px;color:var(--gold);display:block}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.inp,select.inp,textarea.inp{background:#0e1536;border:1px solid #2f3b7d;border-radius:12px;padding:10px 12px;color:var(--ink);width:100%;min-width:0;font-size:16px}
textarea.inp{resize:vertical;min-height:110px;line-height:1.7}
.inp.en{direction:ltr;text-align:left}
.check{display:flex;gap:10px;align-items:flex-start;background:#0f1638;border:1px solid #26326a;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink2);font-size:14.5px}
.check input{width:22px;height:22px;accent-color:var(--mint);flex:0 0 auto;margin-top:2px}
.check.y{border-color:#1c6e5a;background:#0d2c2b;color:var(--ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:12px;border:1px solid #2f3b7d;background:#0e1536;color:var(--muted);font-size:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.dot.y{background:var(--mint);border-color:var(--mint);color:#062a20}
.dot.today{outline:2px solid var(--gold);outline-offset:2px}
.prog{height:12px;background:#0b1130;border-radius:9px;overflow:hidden;border:1px solid #26306a}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:9px;transition:width .4s}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#0f1638;border:1px solid #26326a;border-radius:14px;padding:10px;text-align:center}
.stat b{font-family:var(--f-display);font-size:26px;display:block;color:var(--gold);line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.ai-out{white-space:pre-wrap;background:#0f1638;border:1px dashed #3b4aa0;border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--ink);min-height:40px}
.ai-out:empty{display:none}
.tile-row{display:flex;gap:8px;flex-wrap:wrap}
.tile{border:2px solid #2f3b7d;background:#0e1536;border-radius:14px;padding:10px 14px;font-family:var(--f-read);font-size:20px;direction:ltr;color:var(--ink);min-height:50px}
.tile.on{border-color:var(--gold);background:#2b2410}
.tile.y{border-color:var(--mint);background:#0d2c2b}
.tile.n{border-color:var(--berry);background:#3a1430}

/* overlays inside stage */
.stage-panel{display:flex;justify-content:center;pointer-events:none;flex:0 0 auto}
.stage-panel.bot{margin-top:auto}
.stage-panel>*{pointer-events:auto}
.sp-card{background:rgba(9,14,40,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(120,140,240,.35);border-radius:16px;padding:10px 12px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.slider input{flex:1;accent-color:var(--ember);min-width:0}
.slider b{font-family:var(--f-display);color:var(--gold);min-width:3.2em;text-align:center}
.flash{font-family:var(--f-read);direction:ltr;font-size:clamp(44px,9vw,84px);color:#fff;text-shadow:0 0 30px rgba(255,180,90,.65);text-align:center;line-height:1.1}

/* boot */
.boot{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--ink2);padding-inline:16px}
.boot .mark{width:64px;height:64px;margin:0 auto 14px;animation:spin 3s linear infinite}
.boot .mark i{width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast + pen */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,240%);opacity:0;visibility:hidden;z-index:90;background:#141d48;border:1px solid #4553a8;color:var(--ink);padding:10px 18px;border-radius:16px;font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,1.3,.4,1);max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#pen{position:fixed;inset:0;z-index:80;touch-action:none;display:none;cursor:crosshair}
#pen.on{display:block}
.penbar{position:fixed;z-index:85;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;gap:6px;background:#121a3e;border:1px solid #3a4796;border-radius:18px;padding:8px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);overflow-x:auto}
.penbar.on{display:flex}
.penbar button{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:#1d275a;flex:0 0 auto;display:grid;place-items:center;color:var(--ink);font-size:16px}
.penbar button.sw.on{border-color:#fff}
.penbar .sw i{width:20px;height:20px;border-radius:50%;display:block}

@media (max-width:980px){
  .world{display:block;min-height:0}
  .world .stage{position:relative;top:0;height:clamp(380px,66vh,600px)}
  .sheet{border:0}
  .tabs{top:calc(59px + env(safe-area-inset-top,0px))}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .top{gap:6px}
  .brand{gap:7px}
  .mark{width:34px;height:34px;flex-basis:34px;border-radius:10px}
  .mark i{width:18px;height:18px}
  .ib{width:38px;height:38px}
  .pill{padding:5px 9px;font-size:15px}
  .brand small{display:none}
  .brand b{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .wc{min-height:140px;padding:10px}
  .q-opts{grid-template-columns:1fr 1fr}
  .tab{font-size:14px;padding:8px 9px}
  .cap{font-size:13px}
  .hub .stage{height:clamp(380px,66vh,600px)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

const Cap={downloads:null,sample:null};
const Cloud={

  }
  emit(p){const i=this.i;this.i=(this.i+1)%this.max;const i3=i*3,i4=i*4;
    this.pos[i3]=p.x;this.pos[i3+1]=p.y;this.pos[i3+2]=p.z;this.vel[i3]=p.vx||0;this.vel[i3+1]=p.vy||0;this.vel[i3+2]=p.vz||0;

/* quiz: q = {q:html, o:[correct,...wrong], say, en:true(options in English), why, auto:true(read on show)} */
function quiz(el,qs,o={}){
  const n=Math.min(o.n||5,qs.length);const list=shuffle(qs).slice(0,n);let i=0,score=0;const res=[];
  const draw=()=>{
    if(i>=list.length){const pass=score>=Math.ceil(list.length*.6);
      el.innerHTML=`<div class="card q-end"><b class="num">${score} / ${list.length}</b><p>${pass?'ممتاز! أنت بطل هذا العالم.':'محاولة جميلة! أعد التحدي لتصل إلى '+Math.ceil(list.length*.6)+' إجابات صحيحة.'}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn hot" type="button" data-again>أعد التحدي</button></div></div>`;
      $('[data-again]',el).onclick=()=>quiz(el,qs,o);
      if(pass){if(o.id)award(o.id,'quiz',o.stars||3,'أنهيت التحدي');celebrate()}return}
    const q=list[i];const opts=shuffle(q.o.map((t,j)=>({t,ok:j===0})));
    el.innerHTML=`<div class="card q"><div class="q-top"><span>سؤال ${i+1} من ${list.length}</span><div class="q-dots">${list.map((_,k)=>`<i class="${res[k]===true?'y':res[k]===false?'n':''}"></i>`).join('')}</div></div>
      <div class="q-prompt">${q.q}${q.say?' '+sayBtn(q.say):''}</div>
      <div class="q-opts">${opts.map((x,k)=>`<button type="button" class="q-opt${q.en?' en-o':''}" data-k="${k}">${esc(x.t)}</button>`).join('')}</div><div class="q-why" hidden></div></div>`;
    if(q.say&&q.auto!==false)setTimeout(()=>Voice.say(q.say,{auto:true}),250);
    let locked=false;
    $$('.q-opt',el).forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const x=opts[+b.dataset.k];b.classList.add(x.ok?'y':'n');if(!x.ok)$$('.q-opt',el)[opts.findIndex(z=>z.ok)].classList.add('y');res[i]=x.ok;if(x.ok){score++;Snd.good()}else Snd.bad();
      const w=$('.q-why',el);w.hidden=false;w.innerHTML=(x.ok?'<b class="ok">صحيح! </b>':'<b class="bad">الإجابة الصحيحة مظللة بالأخضر. </b>')+(q.why||'')+`<div class="row" style="margin-top:8px"><button class="btn sm hot" type="button" data-next>التالي ←</button></div>`;
      $('[data-next]',el).onclick=()=>{i++;draw()}});
  };
  draw();
}

    x.strokeStyle='#c7cde6';x.lineWidth=2;x.font='400 30px '+FONT_R;
    rows.forEach((r,ri)=>{y+=rowH;x.fillStyle=ri%2?'#fafbff':'#ffffff';x.fillRect(pad,y,W-pad*2,rowH);x.fillStyle='#1f2a52';r.forEach((v,i)=>{let s=String(v==null?'':v);while(x.measureText(s).width>cw-26&&s.length>3)s=s.slice(0,-2)+'…';x.fillText(s,pad+16+cw*i,y+48)})});
    x.strokeRect(pad,270,W-pad*2,(rows.length+1)*rowH);for(let i=1;i<head.length;i++){x.beginPath();x.moveTo(pad+cw*i,270);x.lineTo(pad+cw*i,270+(rows.length+1)*rowH);x.stroke()}
    if(note){x.fillStyle='#4d5880';x.font='400 28px '+FONT_R;x.fillText(note,pad,y+rowH+70)}
    x.fillStyle='#9aa3c7';x.font='400 22px '+FONT_R;x.fillText('BrightSteps 3D · Year 2 · Autumn 2 home learning',pad,H-40);
    for(let i=0;i<5;i++){const cx=W-pad-30-i*52,cy=110;x.fillStyle=i<3?accent:'#ffd166';x.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?10:24;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.fill()}
  });
  return new Promise(r=>c.toBlob(r,'image/png'));

/* "Writing buddy": asks Claude for kind feedback when the viewer allows it */
async function askBuddy(out,btn,{task,text}){
  if(!Cap.sample||!text||!text.trim())return;
  btn.disabled=true;out.textContent='يقرأ المساعد… Thinking…';
  const prompt=`You are a warm, encouraging writing helper for a 7-year-old child in Year 2 at a primary school in England. The child's first language is Arabic and they are learning to write in English. A parent is sitting with the child.
The writing task: ${task}
The child's writing (between the markers):
<<<
${text.slice(0,1500)}
>>>
Reply in plain text with exactly three short lines and nothing else:
1) Start with "⭐ " then one specific thing the child did well, in very simple English (max 15 words).
2) Start with "🌱 " then ONE small next step in very simple English (max 18 words). Prefer Year 2 targets: capital letters, full stops, using "because" or "and" to join ideas, commas in a list, apostrophes in words like don't and can't, describing words (adjectives), spelling of a tricky word. Quote the exact word or place to fix.
3) Start with "👨‍👩‍👦 " then one or two sentences in Arabic for the parent explaining the next step and how to help.
Do not rewrite the whole text. Be kind. If the writing is unrelated or inappropriate, gently suggest writing about the task instead.`;
  try{const r=await Cap.sample(prompt,{modelTier:'quick',onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(e){const c=e&&e.code;out.textContent=c==='not_granted'?'لم يتم السماح للمساعد. يمكنك المتابعة بدونه.':c==='rate_limited'?'المساعد مشغول الآن، جرّب بعد دقيقة.':c==='cancelled'?'':'تعذّر الوصول إلى المساعد الآن.';if(c==='not_granted'){Cap.sample=null;App.capsChanged()}}
  btn.disabled=false;
}

/* keep maths left-to-right inside Arabic sentences: "3 + 1 = 4" never flips */
const MATH_T=/(?:[□?]|\d+)(?:\s*[+\-−×÷=]\s*(?:[□?]|\d+))+/,MATH_G=new RegExp(MATH_T.source,'g');
function bidi(root){if(!root||!root.ownerDocument)return;const w=document.createTreeWalker(root.nodeType===3?root.parentNode:root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('.en,.num,script,style,textarea,input,.flash,.big-en,.enline'))return NodeFilter.FILTER_REJECT;return MATH_T.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
  const list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(n=>{const s=n.nodeValue;const f=document.createDocumentFragment();let last=0,m;MATH_G.lastIndex=0;while((m=MATH_G.exec(s))){if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));const sp=document.createElement('span');sp.className='num';sp.textContent=m[0];f.appendChild(sp);last=m.index+m[0].length}if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));n.parentNode&&n.parentNode.replaceChild(f,n)})}
function bidiWatch(){new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){m.target.parentElement&&bidi(m.target.parentElement);continue}for(const n of m.addedNodes){if(n.nodeType===1)bidi(n);else if(n.nodeType===3&&n.parentElement&&MATH_T.test(n.nodeValue))bidi(n.parentElement)}}}).observe(document.body,{childList:true,subtree:true,characterData:true})}

const Pen={
  on:false,color:'#ff7b39',size:6,strokes:[],cur:null,
  init(){
    this.c=$('#pen');this.x=this.c.getContext('2d');this.bar=$('#penbar');
    const cols=['#ff7b39','#ffd166','#3ddbb0','#6db4ff','#ffffff','#ff5d8f'];
    this.bar.innerHTML=cols.map(c=>`<button type="button" class="sw${c===this.color?' on':''}" data-c="${c}" aria-label="لون"><i style="background:${c}"></i></button>`).join('')+`<button type="button" data-a="thick" aria-label="سماكة">◐</button><button type="button" data-a="undo" aria-label="تراجع">↶</button><button type="button" data-a="clear" aria-label="مسح">🗑</button><button type="button" data-a="close" aria-label="إغلاق">✕</button>`;
    this.bar.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){this.color=b.dataset.c;$$('.sw',this.bar).forEach(s=>s.classList.toggle('on',s===b))}else if(b.dataset.a==='undo'){this.strokes.pop();this.draw()}else if(b.dataset.a==='clear'){this.strokes=[];this.draw()}else if(b.dataset.a==='thick'){this.size=this.size===6?12:this.size===12?3:6;toast('سماكة القلم: '+this.size)}else if(b.dataset.a==='close')this.toggle(false)};
    const P=e=>({x:e.clientX,y:e.clientY});
    this.c.addEventListener('pointerdown',e=>{this.c.setPointerCapture(e.pointerId);this.cur={c:this.color,s:this.size,p:[P(e)]};this.strokes.push(this.cur);this.draw()});
    this.c.addEventListener('pointermove',e=>{if(!this.cur)return;this.cur.p.push(P(e));this.draw()});
    const end=()=>{this.cur=null};this.c.addEventListener('pointerup',end);this.c.addEventListener('pointercancel',end);
    window.addEventListener('resize',()=>{if(this.on)this.fit()});
  },
  fit(){const d=Math.min(devicePixelRatio||1,2);this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.x.setTransform(d,0,0,d,0,0);this.draw()},
  toggle(v){this.on=v==null?!this.on:v;this.c.classList.toggle('on',this.on);this.bar.classList.toggle('on',this.on);const b=$('#penBtn');b&&b.classList.toggle('on',this.on);if(this.on){this.fit();toast('وضع الشرح: ارسم فوق أي شيء بإصبعك')}},
  draw(){const x=this.x;x.clearRect(0,0,innerWidth,innerHeight);x.lineCap='round';x.lineJoin='round';for(const s of this.strokes){x.strokeStyle=s.c;x.lineWidth=s.s;x.shadowColor=s.c;x.shadowBlur=6;x.beginPath();s.p.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));if(s.p.length===1)x.lineTo(s.p[0].x+.1,s.p[0].y);x.stroke()}x.shadowBlur=0},
  wipe(){this.strokes=[];if(this.on)this.draw()}
};

  tabs:{

function polyPts(s){if(s.rect){const [w,h]=s.rect;return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]}const n=s.n||64,o=(s.rot||Math.PI/2);return [...Array(n)].map((_,i)=>{const a=o+i*Math.PI*2/n;return [Math.cos(a)*s.R,Math.sin(a)*s.R]})}

world({id:'shapes3d',d:'maths',ar:'مختبر المجسّمات',en:'3D Shape Lab',icon:'🧊',color:'#ff7b39',blurb:'الأوجه والحواف والرؤوس — افتح المجسم كشبكة!',goals:['learn','count','net','roll','pattern','quiz'],
  build(ctx){
    const {scene,orbit}=ctx;G.sky(scene,{top:'#0b0a26',mid:'#2a1d58',bot:'#1a1033',glow:'#ff7b39',glowStrength:.16});G.lights(scene,{hemi:1,sunI:1.1,pos:[5,12,8]});
    const fl=G.ground(9,'#1d1a44');scene.add(fl);const grid=new THREE.GridHelper(16,16,0x3a3f8a,0x2a2f6a);grid.position.y=.01;scene.add(grid);
    const holder=new THREE.Group();scene.add(holder);const over=new THREE.Group();over.position.y=.03;scene.add(over);
    let cur=null,model=null,mode='solid',real=false,busy=false,netT=0;
    const faceCols=['#ff7b39','#6db4ff','#3ddbb0','#ffd166','#ff8fb1','#b29bff'];
    const fmat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.45,side:THREE.DoubleSide});
    const quad=(w,h)=>new THREE.PlaneGeometry(w,h);
    function boxModel(w,h,d){const root=new THREE.Group();const faces=[],hinges=[];
      const bottom=new THREE.Mesh(quad(w,d),fmat(cur.col));bottom.rotation.x=-Math.PI/2;root.add(bottom);faces.push({m:bottom,n:new THREE.Vector3(0,-1,0)});
      let backHinge=null;
      for(let k=0;k<4;k++){const yaw=new THREE.Group();yaw.rotation.y=k*Math.PI/2;root.add(yaw);const len=k%2?d:w,dist=k%2?w/2:d/2;const hinge=new THREE.Group();hinge.position.z=dist;yaw.add(hinge);
        const f=new THREE.Mesh(quad(len,h),fmat(cur.col));f.position.y=h/2;hinge.add(f);faces.push({m:f});hinges.push({h:hinge,fold:0,open:Math.PI/2,yaw,dist});if(k===2)backHinge=hinge}
      const th=new THREE.Group();th.position.y=h;backHinge.add(th);const top=new THREE.Mesh(quad(w,d),fmat(cur.col));top.rotation.x=-Math.PI/2;top.position.z=-d/2;th.add(top);faces.push({m:top});hinges.push({h:th,fold:0,open:Math.PI/2,top:true,dist:0,y0:h});
      const V=[];[0,h].forEach(y=>[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]].forEach(([x,z])=>V.push(new THREE.Vector3(x,y,z))));
      const Eg=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];return {root,faces,hinges,V,E:Eg.map(([a,b])=>[V[a],V[b]]),kind:'poly'}}
    function pyrModel(b,H){const root=new THREE.Group();const faces=[],hinges=[];const base=new THREE.Mesh(quad(b,b),fmat(cur.col));base.rotation.x=-Math.PI/2;root.add(base);faces.push({m:base});
      const sl=Math.hypot(H,b/2),beta=Math.asin((b/2)/sl);
      for(let k=0;k<4;k++){const yaw=new THREE.Group();yaw.rotation.y=k*Math.PI/2;root.add(yaw);const hinge=new THREE.Group();hinge.position.z=b/2;yaw.add(hinge);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([-b/2,0,0,b/2,0,0,0,sl,0],3));g.computeVertexNormals();const f=new THREE.Mesh(g,fmat(cur.col));hinge.add(f);hinge.rotation.x=-beta;faces.push({m:f});hinges.push({h:hinge,fold:-beta,open:Math.PI/2,yaw,dist:b/2})}
      const V=[[-b/2,-b/2],[b/2,-b/2],[b/2,b/2],[-b/2,b/2]].map(([x,z])=>new THREE.Vector3(x,0,z));V.push(new THREE.Vector3(0,H,0));const Eg=[[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]];return {root,faces,hinges,V,E:Eg.map(([a,c])=>[V[a],V[c]]),kind:'poly'}}
    function cylModel(R,H){const root=new THREE.Group();const seg=48;const g=new THREE.PlaneGeometry(Math.PI*2*R,H,seg,1);const base=g.attributes.position.array.slice(0);const sheet=new THREE.Mesh(g,fmat(cur.col));root.add(sheet);
      const setT=t=>{const p=g.attributes.position;const kap=(1-t)/R;for(let i=0;i<p.count;i++){const u=base[i*3],v=base[i*3+1];let x,z;if(kap<1e-4){x=u;z=R}else{x=Math.sin(u*kap)/kap;z=R+(Math.cos(u*kap)-1)/kap}p.setXYZ(i,x,v+H/2,z)}p.needsUpdate=true;g.computeVertexNormals()};setT(0);
      const disc=()=>new THREE.Mesh(new THREE.CircleGeometry(R,48),fmat(cur.col));const th=new THREE.Group();th.position.set(0,H,R);const tp=disc();tp.rotation.x=-Math.PI/2;tp.position.z=-R;th.add(tp);root.add(th);const bh=new THREE.Group();bh.position.set(0,0,R);const bt=disc();bt.rotation.x=Math.PI/2;bt.position.z=-R;bh.add(bt);root.add(bh);
      return {root,faces:[{m:tp},{m:bt}],curved:[sheet],setT,hinges:[{h:th,fold:0,open:Math.PI/2},{h:bh,fold:0,open:-Math.PI/2}],rims:[[R,H],[R,0]],V:[],kind:'cyl'}}
    function coneModel(R,H){const root=new THREE.Group();const lat=new THREE.Mesh(new THREE.ConeGeometry(R,H,48,1,true),fmat(cur.col));lat.position.y=H/2;root.add(lat);const bt=new THREE.Mesh(new THREE.CircleGeometry(R,48),fmat(cur.col));bt.rotation.x=Math.PI/2;bt.position.y=.001;root.add(bt);return {root,faces:[{m:bt}],curved:[lat],rims:[[R,0]],V:[new THREE.Vector3(0,H,0)],kind:'cone',lat,bt}}
    function sphModel(R){const root=new THREE.Group();const s=new THREE.Mesh(new THREE.SphereGeometry(R,48,32),fmat(cur.col));s.position.y=R;root.add(s);return {root,faces:[],curved:[s],V:[],kind:'sph',s}}
    function load(s){cur=s;mode='solid';netT=0;clearOver();if(model)holder.remove(model.root);holder.position.y=0;const m=s.k==='cube'?boxModel(2.2,2.2,2.2):s.k==='cuboid'?boxModel(3.2,1.6,1.8):s.k==='pyramid'?pyrModel(2.6,2.3):s.k==='cylinder'?cylModel(1.05,2.4):s.k==='cone'?coneModel(1.3,2.6):sphModel(1.35);
      model=m;m.root.position.y=.03;holder.add(m.root);holder.position.set(0,0,0);m.root.scale.setScalar(.01);E.tw(m.root.scale,{x:1,y:1,z:1},.55,Ease.back);if(real)applyReal(true);info();Voice.say(s.name,{auto:true})}
    function info(){const s=cur;const parts=[];parts.push(s.flat+(s.flat===1?' flat face':' flat faces'));if(s.curved)parts.push('1 curved surface');parts.push(s.e+(s.e===1?' edge':' edges'));parts.push(s.v+(s.v===1?' vertex':' vertices'));
      cap(s.name+' · '+parts.join(' · '),`${s.ar}: ${s.flat} أوجه مستوية${s.curved?' + سطح منحنٍ واحد':''} · ${s.e} حواف · ${s.v} رؤوس. في الحياة: ${s.realAr}.`)}
    function clearOver(){while(over.children.length)over.remove(over.children[0])}
    function colorFaces(on){model.faces.forEach((f,i)=>{f.m.material.color.set(on?faceCols[i%6]:cur.col)});(model.curved||[]).forEach(c=>c.material.color.set(on?'#e8ecff':cur.col))}
    async function countFaces(){if(busy)return;busy=true;await toSolid();clearOver();colorFaces(true);const fs=model.faces;
      for(let i=0;i<fs.length;i++){const c=new THREE.Vector3();fs[i].m.getWorldPosition(c);if(fs[i].m.geometry.type==='BufferGeometry'){fs[i].m.geometry.computeBoundingSphere();c.copy(fs[i].m.localToWorld(fs[i].m.geometry.boundingSphere.center.clone()))}
        const l=G.label(String(i+1),{size:.6,color:'#fff',stroke:'#10142e',px:72});l.position.copy(c).add(c.clone().sub(new THREE.Vector3(0,1.1,0)).normalize().multiplyScalar(.5));over.add(l);fs[i].m.material.emissive.set('#ffffff');fs[i].m.material.emissiveIntensity=.35;setTimeout(()=>{fs[i].m.material.emissiveIntensity=0},500);Voice.say(['one','two','three','four','five','six'][i],{auto:true,rate:1});Snd.tick();await E.wait(.7)}
      (model.curved||[]).forEach(c=>{const p=new THREE.Vector3();c.getWorldPosition(p);const l=G.label('curved surface',{size:.45,color:'#16204a',bg:'#e8ecff',px:48});l.position.copy(p).add(new THREE.Vector3(1.6,.9,0));over.add(l)});
      cap(cur.flat+' flat faces'+(cur.curved?' + 1 curved surface':''),'الوجه (face) = سطح مستوٍ. '+(cur.curved?'وله سطح <b>منحنٍ</b> أيضاً.':''));award('shapes3d','count',2,'عدّاد الأوجه');busy=false}
    async function countEdges(){if(busy)return;busy=true;await toSolid();clearOver();colorFaces(false);
      if(model.kind==='poly'){for(let i=0;i<model.E.length;i++){const [a,b]=model.E[i];const t=G.tube(a,b,.065,'#ffffff',{emissive:'#ffd166',emissiveIntensity:1.2});over.add(t);const m=a.clone().add(b).multiplyScalar(.5);const l=G.label(String(i+1),{size:.42,color:'#ffd166',stroke:'#140c00',px:64});l.position.copy(m).add(m.clone().sub(new THREE.Vector3(0,1.1,0)).normalize().multiplyScalar(.35));over.add(l);Snd.tick();await E.wait(.45)}}
      else(model.rims||[]).forEach(([R,y],i)=>{const r=G.mesh(new THREE.TorusGeometry(R,.06,8,64),G.m('#ffffff',{emissive:'#ffd166',emissiveIntensity:1.2}));r.rotation.x=Math.PI/2;r.position.y=y+.01;over.add(r);const l=G.label(String(i+1),{size:.5,color:'#ffd166',stroke:'#140c00',px:64});l.position.set(R+.4,y+.2,0);over.add(l)});
      cap(cur.e+' edges','الحافة (edge) = حيث يلتقي وجهان. '+(cur.e?'عددنا <b>'+cur.e+'</b>.':'الكرة بلا حواف.'));busy=false}
    async function countVerts(){if(busy)return;busy=true;await toSolid();clearOver();colorFaces(false);for(let i=0;i<model.V.length;i++){const s=G.sph(.15,'#ff5d8f',{emissive:'#ff5d8f',emissiveIntensity:1});s.position.copy(model.V[i]);over.add(s);s.scale.setScalar(.01);E.tw(s.scale,{x:1,y:1,z:1},.35,Ease.back);const l=G.label(String(i+1),{size:.45,color:'#ff8fb1',stroke:'#140010',px:64});l.position.copy(model.V[i]).add(model.V[i].clone().sub(new THREE.Vector3(0,1.1,0)).normalize().multiplyScalar(.4));over.add(l);Snd.pop();await E.wait(.5)}
      cap(cur.v===1?'1 vertex':cur.v+' vertices','الرأس (vertex) = زاوية تلتقي فيها الحواف. vertex = رأس واحد، vertices = أكثر من رأس.'+(cur.v?'':' هذا المجسم بلا رؤوس.'));busy=false}
    function setNet(t){netT=t;if(model.hinges)model.hinges.forEach(h=>{h.h.rotation.x=lerp(h.fold,h.open,t)});if(model.setT)model.setT(Math.min(1,t*1.15));if(model.kind==='cyl')holder.position.y=t*2.25;if(model.kind==='cone'){model.bt.position.y=-t*1.4+.001;model.lat.position.y=2.6/2+t*.6;model.bt.rotation.x=Math.PI/2-t*Math.PI/2.4;holder.position.y=t*2.7}}
    async function toSolid(){if(netT>0){await E.anim(.8,k=>setNet(netT*(1-k)));setNet(0)}if(mode==='explode')await explode(false);mode='solid'}
    async function net(){if(busy)return;busy=true;clearOver();if(mode==='explode')await explode(false);colorFaces(true);const open=netT<.5;
      if(cur.k==='sphere'){cap('A sphere has no flat faces','الكرة لا تُفتح كشبكة — لها سطح منحنٍ واحد فقط.');Snd.bad();busy=false;return}
      Snd.whoosh();const from=netT;if(open&&cur.k!=='cube')orbit.flyTo({target:new THREE.Vector3(0,cur.k==='cylinder'?2.6:1.2,cur.k==='cylinder'?1:0),r:E.fit(cur.k==='cylinder'?9:8,cur.k==='cylinder'?13:10),phi:cur.k==='cylinder'?1.35:.95},1.2);else if(!open)orbit.goHome(1.2);await E.anim(1.8,k=>setNet(lerp(from,open?1:0,k)),Ease.inOut);
      cap(open?'The net of a '+cur.name.toLowerCase():cur.name,open?(cur.k==='cone'?'المخروط = دائرة + سطح منحنٍ.':'هذه <b>شبكة</b> المجسم: أوجهه مفرودة على الأرض. عدّها!'):'أعدناه مجسّماً.');if(open)award('shapes3d','net',2,'فاتح الشبكات');busy=false}
    async function explode(on){if(!model)return;mode=on?'explode':'solid';const k=on?1:0;
      if(model.hinges&&model.kind==='poly'){await Promise.all(model.hinges.map(h=>h.top?E.tw(h.h.position,{y:h.y0+k*1.2,z:-k*1.3},.6,Ease.back):E.tw(h.h.position,{z:h.dist+k*1.3,y:k*.3},.6,Ease.back)).concat([E.tw(model.faces[0].m.position,{y:-k*.6},.6,Ease.back),E.tw(holder.position,{y:k*.8},.6,Ease.back)]))}
      else if(model.kind==='cyl'){await Promise.all([E.tw(model.hinges[0].h.position,{y:2.4+k*1.2},.6,Ease.back),E.tw(model.hinges[1].h.position,{y:-k*1.2},.6,Ease.back)]);holder.position.y=k*1.2}
      else if(model.kind==='cone'){await Promise.all([E.tw(model.bt.position,{y:-k*1.4+.001},.6,Ease.back)]);holder.position.y=k*1.4}
      else if(model.kind==='sph'){await E.tw(model.s.scale,{x:1+k*.2,y:1-k*.1,z:1+k*.2},.4,Ease.back)}}
    function applyReal(on){if(!model)return;const tex=(f)=>f?new THREE.MeshStandardMaterial({map:f,roughness:.5,side:THREE.DoubleSide}):null;
      if(cur.k==='cube')model.faces.forEach((f,i)=>{f.m.material=on?new THREE.MeshStandardMaterial({map:Dice.tex(i+1),roughness:.35,side:THREE.DoubleSide}):fmat(cur.col)});
      else if(cur.k==='cuboid'){const ct=realTex.cereal();model.faces.forEach((f,i)=>{f.m.material=on?(i===1||i===3?tex(ct):new THREE.MeshStandardMaterial({color:'#e8402a',roughness:.6,side:THREE.DoubleSide})):fmat(cur.col)})}
      else if(cur.k==='pyramid'){const bt=realTex.bricks();model.faces.forEach(f=>{f.m.material=on?tex(bt):fmat(cur.col)})}
      else if(cur.k==='cylinder'){model.curved[0].material=on?tex(realTex.can()):fmat(cur.col);model.faces.forEach(f=>f.m.material=on?new THREE.MeshStandardMaterial({color:'#c9cfe0',metalness:.8,roughness:.3,side:THREE.DoubleSide}):fmat(cur.col))}
      else if(cur.k==='cone'){model.curved[0].material=on?tex(realTex.stripes()):fmat(cur.col);model.faces.forEach(f=>f.m.material=on?new THREE.MeshStandardMaterial({color:'#2a2d3a',side:THREE.DoubleSide}):fmat(cur.col))}
      else if(cur.k==='sphere'){model.curved[0].material=on?tex(realTex.ball()):fmat(cur.col)}
      if(on)cap(cur.name+' in real life: '+cur.real,'في حياتنا: '+cur.realAr+'. <b>ابحث عن أشكال حولك!</b>');else info()}
    // ---- roll or slide ramp ----
    const ramp=new THREE.Group();ramp.position.set(14,0,0);scene.add(ramp);ramp.visible=false;
    const rb=G.box(9,.3,6.6,'#3a3f8a');rb.rotation.z=-.32;rb.position.set(0,1.6,0);ramp.add(rb);const rf=G.box(8,.2,6.6,'#2a2f6a');rf.position.set(8,.1,0);ramp.add(rf);
    const rollers=[];

};

function mannequin(col){

  const seg=(len,r,m)=>{const piv=new THREE.Group();const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,12),m);c.position.y=-len/2;piv.add(c);const j=new THREE.Mesh(new THREE.SphereGeometry(r*1.05,12,10),m);piv.add(j);const end=new THREE.Group();end.position.y=-len;piv.add(end);piv.userData.end=end;return piv};
  const root=new THREE.Group();const spine=new THREE.Group();root.add(spine);const torso=new THREE.Mesh(new THREE.CylinderGeometry(.24,.2,.7,14),mt);torso.position.y=.37;spine.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.2,18,14),sk);head.position.y=.95;spine.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.205,18,14,0,Math.PI*2,0,Math.PI*.5),dk);hair.position.y=.97;hair.rotation.x=-.3;spine.add(hair);
  const J={root,spine};[['lSh',.3,.66,mt,.36,.075,'lEl',.33,sk],['rSh',-.3,.66,mt,.36,.075,'rEl',.33,sk]].forEach(([n,x,y,m,l1,r,n2,l2,m2])=>{const a=seg(l1,r,m);a.position.set(x,y,0);spine.add(a);const b=seg(l2,r*.85,m2);a.userData.end.add(b);J[n]=a;J[n2]=b});
  [['lHip',.12,dk,'lKn'],['rHip',-.12,dk,'rKn']].forEach(([n,x,m,n2])=>{const a=seg(.48,.095,m);a.position.set(x,0,0);root.add(a);const b=seg(.48,.08,sk);a.userData.end.add(b);J[n]=a;J[n2]=b;const foot=G.box(.12,.08,.22,'#ffffff');foot.position.set(0,-.02,.06);b.userData.end.add(foot)});
  return J;
}

    function chirp(){[2200,2600,2000].forEach((f,i)=>Snd.tone(f,.08,{type:'sine',vol:.08,at:i*.09,slide:f*1.2}))}
    function pickGem(i){sel=i;const v=VALUES[i];chirp();flap=1;cap(v[0]+' — '+v[2],'<b>'+v[1]+'</b>: '+v[3]);Voice.say(v[0]+'. '+v[2],{auto:true});FX.sparkle(gems[i].g.position.clone(),{colors:[gems[i].c,'#fff'],n:24});Store.s.gems=Object.assign(Store.s.gems||{},{[i]:1});if(Object.keys(Store.s.gems).length>=8)award('magpie','gems',2,'جامع القيم');else Store.save()}
    ctx.bar([{id:'g',label:'القيم الثماني',fn:()=>{sel=-1;orbit.goHome(.8);cap('Tap a gem','اضغط جوهرة لتعرف القيمة.')}},...POWERS.map(p=>({id:p[0],label:p[2],fn:()=>{chirp();flap=1;cap(p[2],'قوة العقعق: <b>'+p[1]+'</b>');Voice.say(p[2].split(' ')[0],{auto:true})}}))]);
    orbit.setHome({target:new THREE.Vector3(0,2.6,0),r:E.fit(11,10.5),theta:.2,phi:1.25});orbit.minR=5;orbit.maxR=20;orbit.auto=.1;
    cap('Tap a gem','اضغط جوهرة لتعرف القيمة، واضغط العقعق ليغنّي!');
    return {update(dt,t){gems.forEach((G0,i)=>{const sp=i===sel;const a=G0.a+t*.25;const R=sp?0:4.6;const target=sp?new THREE.Vector3(1.6,2.4,2.4):new THREE.Vector3(Math.cos(a)*R+.5,2.2+Math.sin(t*1.3+i)*.35,Math.sin(a)*R);G0.g.position.lerp(target,Math.min(1,dt*3));G0.g.rotation.y+=dt*(sp?2:.6);G0.g.scale.setScalar(sp?1.8:1)});
      if(flap>0){flap-=dt;mag.userData.flap(t*14,.9);mag.position.y=3.95+Math.max(0,Math.sin(flap*Math.PI))*.4}else{mag.userData.fold();mag.position.y=3.95;mag.rotation.x=Math.sin(t*2)*.05}}};
  },
  tabs:{
    learn(el){el.innerHTML=`<div class="card glow"><span class="kicker">من الكتيّب · Characteristics of Effective Learning</span><h3>العقعق المتحمّس 🐦</h3><p>هذا الفصل نركّز على سلوكيات "Motivated Magpie": يُهنَّأ الأطفال على <b>التركيز</b> و<b>المشاركة النشطة</b> في التعلّم والحياة المدرسية، وعلى <b>المثابرة</b>. ونساعدهم على معرفة ما أحسنوا فعله والاحتفال بنتائجهم.</p></div>
      <div class="card"><h3>قيم المدرسة الثماني</h3><div class="tbl-wrap"><table>${VALUES.map(v=>`<tr><td><b class="en">${v[0]}</b> ${sayBtn(v[0]+'. '+v[2])}<br><small>${v[1]}</small></td><td><span class="en" style="font-size:14px">${v[2]}</span><br><small>${v[3]}</small></td></tr>`).join('')}</table></div></div>
      <div class="card"><h3>"Happy Pupils Succeed"</h3><p>الأطفال السعداء ينجحون لأنهم <b>معروفون، ومحتضنون، ومُتحدَّون، ومُلهَمون</b> ليصبحوا أفضل نسخة من أنفسهم.</p></div>`},
    play(el){const wk=monday(today());const key='m'+ymd(wk);const M=Store.s.magpie[key]||(Store.s.magpie[key]={});const days=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
      el.innerHTML=`<div class="card glow"><h3>جدول نجوم العقعق — هذا الأسبوع</h3><div class="tbl-wrap"><table><tr><th></th>${POWERS.map(p=>`<th>${p[1]}</th>`).join('')}</tr>${days.map((d,i)=>`<tr><td>${d}</td>${POWERS.map(p=>`<td><button class="dot${M[i+p[0]]?' y':''}" type="button" data-c="${i+p[0]}">★</button></td>`).join('')}</tr>`).join('')}</table></div></div>
        <div class="card"><h3>ماذا أحسنتُ اليوم؟</h3><p class="note">What did I do well today?</p><input class="inp en" id="well" maxlength="80" value="${esc(M.well||'')}" placeholder="Today I kept trying with my reading."><div class="row" style="margin-top:8px"><button class="btn hot" type="button" id="wellS">احتفل 🎉</button></div></div>`;
      $$('[data-c]',el).forEach(b=>b.onclick=()=>{M[b.dataset.c]=M[b.dataset.c]?0:1;b.classList.toggle('y');Store.save();Snd.tick();if(Object.values(M).filter(v=>v===1).length>=6)award('magpie','chart',2,'نجوم العقعق')});
      $('#wellS',el).onclick=()=>{M.well=$('#well',el).value.trim();Store.save();if(M.well){celebrate('أحسنت! 🎉');Voice.say(M.well)}}},
    quiz:[{q:'العقعق المتحمّس…',o:['مركّز ومشارك ولا يستسلم','يستسلم بسرعة','لا يستمع'],why:'Focused, engaged, persevering.'},{q:'<span class="en">Integrity</span> تعني…',o:['الصدق حتى عندما لا يراك أحد','الجري بسرعة','الرسم'],why:'النزاهة.'},{q:'<span class="en">Collaboration</span> تعني…',o:['العمل معاً كفريق','العمل وحدي دائماً','النوم'],why:'التعاون.'},{q:'عندما أخطئ…',o:['أتعلّم وعقلي ينمو','أتوقف عن المحاولة','أبكي فقط'],why:'Growth.'},{q:'<span class="en">Inclusion</span> تعني…',o:['الكل ينتمي ونشرك الآخرين','نلعب وحدنا','نختار أصدقاء قليلين فقط'],why:'الإدماج.'}],
    home(el){el.innerHTML=`<div class="card"><span class="kicker">في البيت</span><h3>سؤال المساء</h3><p>اسأل طفلك كل مساء: "<span class="en">What did you do well today?</span>" ثم احتفلا معاً. وفي نهاية الأسبوع اختارا قيمة واحدة من الثماني لتتدرّبا عليها.</p></div>`}
  }
});
